<style>

  .hud button {
    width: 52px; height: 52px; border-radius: 50%; border: none;

    position: fixed; inset: 0; z-index: 10;

    transition: opacity .4s;
  }
  #start.hide { opacity: 0; pointer-events: none; }
  #start h1 {
    margin: 0; text-align: center;

<body>
<canvas id="game" role="img" aria-label="Gioco: tocca i pupazzetti, il guantone li fa volare in cielo"></canvas>

<div class="hud">
  <button id="btnSpeed" aria-label="Velocità: lenta">🐢</button>
  <button id="btnMute" aria-label="Spegni l'audio">🔊</button>
  <button id="btnFull" aria-label="Schermo intero">⛶</button>
</div>

<div id="start">
  <h1>Il gioco di Lolo</h1>
  <p>Tocca i pupazzetti! 🥊</p>
  <button id="play" aria-label="Gioca">▶</button>
</div>

<script>
'use strict';
/* =========================================================
   Il gioco di Lolo — Guantone Boing
   Tocca un pupazzetto: arriva il guantone e lo fa volare.
   Alcuni sono nascosti dietro sassi, cespugli, divani e
   scatole dei giochi: tocca il nascondiglio e... cucù!
   Niente punti, niente "hai perso": solo azione e risate.
   ========================================================= */

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

// ---------- palette (pastelli) ----------
const PUPI_COLORS = [
  { body: '#c9a7f5', dark: '#9f7fd6' }, // lilla
  { body: '#9fe6bf', dark: '#6cc797' }, // menta
  { body: '#ffe28a', dark: '#e8bf4f' }, // burro
  { body: '#ffadc2', dark: '#ec88a3' }, // rosa
  { body: '#9fd3ff', dark: '#6fb0e8' }, // celeste
  { body: '#ffc59e', dark: '#eda271' }, // pesca
];
const ANTENNAS = ['loop', 'tri', 'stick', 'curl'];

// ---------- forme dei pupazzetti (geometria!) ----------
// top = dove parte l'antenna, arm/armY = spalle, cx = guance, fy = spostamento faccina. Tutte stanno in piedi a +r.
const SHAPES = {
  tondo: {
    top: -1.0, arm: .8, armY: -.05, cx: .58, fy: 0,
    path(c, r) { ell(c, 0, 0, r, r * 1.02); },
  },
  ovale: { // ovale largo, sdraiato
    top: -.72, arm: .98, armY: .2, cx: .66, fy: .16,
    path(c, r) { ell(c, 0, r * .15, r * 1.18, r * .86); },
  },
  quadrato: {
    top: -.95, arm: .88, armY: -.05, cx: .55, fy: 0,
    path(c, r) { rr(c, -r * .95, -r * .95, r * 1.9, r * 1.92, r * .3); },
  },
  rettangolo: { // alto e stretto
    top: -1.18, arm: .66, armY: -.1, cx: .42, fy: -.05,
    path(c, r) { rr(c, -r * .72, -r * 1.18, r * 1.44, r * 2.15, r * .3); },
  },
  triangolo: { // con gli angoli arrotondati
    top: -.88, arm: .55, armY: .35, cx: .42, fy: .28,
    path(c, r) {
      const p = [[0, -1.25], [1.12, .97], [-1.12, .97]].map(([x, y]) => [x * r, y * r]);
      c.beginPath();
      c.moveTo((p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2);
      for (let i = 1; i <= 3; i++) c.arcTo(p[i % 3][0], p[i % 3][1], p[(i + 1) % 3][0], p[(i + 1) % 3][1], r * .32);
      c.closePath();
    },
  },
};
// poligono con gli angoli arrotondati (per la stella)
function roundPoly(c, pts, rad) {
  const n = pts.length;
  c.beginPath();
  c.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  for (let i = 1; i <= n; i++) c.arcTo(pts[i % n][0], pts[i % n][1], pts[(i + 1) % n][0], pts[(i + 1) % n][1], rad);
  c.closePath();
}
SHAPES.cuore = {
  top: -.55, arm: .95, armY: -.15, cx: .6, fy: 0, feetX: .22,
  path(c, r) {
    c.beginPath(); c.moveTo(0, r * 1.0);
    c.bezierCurveTo(-r * .55, r * .6, -r * 1.2, r * .1, -r * 1.12, -r * .4);
    c.bezierCurveTo(-r * 1.05, -r * .95, -r * .3, -r * 1.05, 0, -r * .55);
    c.bezierCurveTo(r * .3, -r * 1.05, r * 1.05, -r * .95, r * 1.12, -r * .4);
    c.bezierCurveTo(r * 1.2, r * .1, r * .55, r * .6, 0, r * 1.0);
    c.closePath();
  },
};
SHAPES.stella = { // 5 punte morbide: le due in basso fanno da gambe
  top: -1.05, arm: .58, armY: .22, cx: .42, fy: .05, feetX: .68, // braccia nell'incavo tra punta laterale e gamba
  path(c, r) {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rad = (i % 2 ? .68 : 1.18) * r;
      pts.push([Math.cos(a) * rad, Math.sin(a) * rad + r * .05]);
    }
    roundPoly(c, pts, r * .16);
  },
};
const SHAPE_NAMES = Object.keys(SHAPES);
// dove sta bene un fiocco/cappellino su ogni forma: hx = distanza dal centro, hy = quanto sotto la cima (negativo = sopra)
const HAT_SPOT = { tondo: [.5, .2], ovale: [.6, .14], quadrato: [.55, .06], rettangolo: [.4, .06], triangolo: [.22, .32], cuore: [.55, -.3], stella: [.55, .5] };

// ---------- accessori ----------
const HATS = ['cappello', 'corona', 'cilindro', 'berretto', 'paglia'];
const ACCESSORIES = ['fiocco', 'occhiali', 'papillon', ...HATS, null, null, null, null]; // ~1 su 3 senza
const ACC_COLORS = ['#ff7fa6', '#6f9ff0', '#ffcf4a', '#9b7bf0', '#3fc488', '#ff9f5a'];
const HIDES = ['rock', 'bush', 'sofa', 'box'];
const FLOWER_COLORS = ['#ffb3c7', '#fff3a0', '#c9b6ff', '#ffffff', '#ffc59e', '#a8d8ff'];
const POWS = ['BOING!', 'POF!', 'WIII!', 'PAF!', 'BOOM!'];
const POW_COLORS = ['#ff8fb1', '#7fa8f5', '#ffaa5c', '#a98bff', '#4fcf8f'];

// ---------- livelli ----------
const HITS_PER_LEVEL = 20;          // colpi per passare al livello successivo (prova 30 se vuoi più lungo)

// ---------- velocità: 🐢 lenta (predefinita) o 🐇 normale ----------
// k = rallentatore globale di tutte le animazioni, maxActive = pupazzetti in scena, cool = attesa prima che ne arrivi uno nuovo (s)
const SPEEDS = {
  lento:   { icon: '🐢', label: 'Velocità: lenta',   k: .55, maxActive: 3,  cool: [2.5, 4.5] },
  normale: { icon: '🐇', label: 'Velocità: normale', k: .8,  maxActive: 5,  cool: [1.6, 3.2] },
};
const SPEED_ORDER = ['lento', 'normale'];
let speedKey = 'lento';
try { const s = localStorage.getItem('lolo-speed'); if (SPEEDS[s]) speedKey = s; } catch (e) {}
const SPD = () => SPEEDS[speedKey];

// ---------- orari: avanzano in sequenza a ogni livello ----------
const TIMES = [
  { key: 'mattina',    sky: ['#9fd4f2', '#ffe1e8'], orb: 'sun',    sx: .22, sy: .27, cloud: ['#ffffff', '#f6e4ee'], tint: 'rgba(255,215,225,.10)' },
  { key: 'pomeriggio', sky: ['#8fd3f7', '#dcf2fb'], orb: 'sun',    sx: .5,  sy: 0,   cloud: ['#ffffff', '#e4f3fa'], tint: null },
  { key: 'sera',       sky: ['#ffb3a7', '#ffe8c9'], orb: 'sunset', sx: .76, sy: .36, cloud: ['#fff4ee', '#ffd6cc'], tint: 'rgba(255,160,110,.13)' },
  { key: 'notte',      sky: ['#4f5ca8', '#a3acdf'], orb: 'moon',   sx: .5,  sy: 0,   cloud: ['#dfe3f7', '#bcc3e8'], tint: 'rgba(35,45,120,.36)', night: true },
];

// ---------- paesaggi: casuali "a sacchetto" (tutti prima di ripeterne uno) ----------
// ground: tipo di terreno · trees/decor: cosa c'è sullo sfondo · hides: nascondigli
// tap: cosa spunta toccando il terreno · fly: come volano via · animals: animaletti sullo sfondo
const LANDS = {
  prato: { name: 'Prato', ground: 'hills', far: '#c4eab9', mid: '#a9df9f', front: ['#9edb93', '#84cb7d'],
    trees: 'lollipop', tree: ['#9fd894', '#8fcf8a', '#b5e3a1'], trunk: '#b39a84', tuft: 'rgba(80,150,80,.35)',
    decor: 'flowers', hides: ['rock', 'bush', 'sofa', 'box'], tap: 'flower', fly: 'normal',
    animals: ['farfalla', 'coccinella', 'uccellino', 'ape', 'lumachina'] },
  neve: { name: 'Neve', ground: 'hills', far: '#f2f7fc', mid: '#e6f0f9', front: ['#f8fbff', '#e1ebf6'],
    trees: 'lollipop', tree: ['#a9d3c0', '#97c7b3'], trunk: '#b8a395', tuft: 'rgba(150,180,215,.4)',
    decor: 'snow', snow: true, hides: ['igloo', 'rock', 'bush', 'box'], tap: 'flower', fly: 'normal',
    animals: ['pinguino', 'orsetto', 'foca', 'pupazzo', 'volpeartica'] },
  sottacqua: { name: 'Sottacqua', ground: 'sea', orb: 'none', noClouds: true,
    sky: { mattina: ['#7fd3e6', '#c4f0ec'], pomeriggio: ['#4cbfe0', '#a9ecf0'], sera: ['#78acd6', '#f6c3b6'], notte: ['#1e3d78', '#3d6aa3'] },
    far: '#6fc3d4', mid: '#8fd8c4', front: ['#f1e2b6', '#e2cd96'], trees: 'coral', tree: ['#ffa7b9', '#ffc59e', '#c9a7f5'], trunk: null,
    tuft: 'rgba(60,150,120,.45)', decor: 'seabed', hides: ['shell', 'coral', 'chest', 'alga'], tap: 'starfish', fly: 'bubble',
    ambient: 'bubbles', animals: ['pesce', 'delfino', 'tartaruga', 'polpo', 'medusa'], maxAnimals: 3 },
  nuvole: { name: 'Nuvole', ground: 'clouds', far: '#e3eaf9', mid: '#f1edfb', front: ['#ffffff', '#edf1fa'],
    trees: 'none', decor: 'sparkle', hides: ['nuvola', 'nuvolarosa', 'casetta', 'mongolfiera'], tap: 'puff', fly: 'bounce',
    animals: ['mongolfierina', 'aquilone', 'uccellino', 'aeroplanino', 'arcobalenino'] },
  fattoria: { name: 'Fattoria', ground: 'hills', far: '#cfe8b0', mid: '#b5dc98', front: ['#a6d68c', '#8cc779'],
    trees: 'lollipop', tree: ['#9fd894', '#b5e3a1'], trunk: '#b39a84', tuft: 'rgba(90,150,70,.35)',
    decor: 'farm', hides: ['fieno', 'fienile', 'zucca', 'bush'], tap: 'flower', fly: 'normal',
    animals: ['mucca', 'cavallo', 'gallina', 'maialino', 'pecorella'] },
  spiaggia: { name: 'Spiaggia', ground: 'beach', far: '#7fcbe8', mid: '#bfe9f2', front: ['#f7e6b8', '#ecd39b'],
    trees: 'palm', tree: ['#7fcf86', '#62bf72'], trunk: '#c9a27a', tuft: null,
    decor: 'sand', hides: ['castello', 'secchiello', 'rock', 'shell'], rock: ['#d3dce8', '#a9b7ca', 'rgba(120,140,170,.45)'],
    tap: 'crab', fly: 'normal', animals: ['gabbiano', 'granchio', 'tartarughina', 'barchetta', 'pallone'] },
  bosco: { name: 'Bosco', ground: 'hills', far: '#b5dcb0', mid: '#98cf92', front: ['#8fca86', '#76b96f'],
    trees: 'forest', tree: ['#7fc488', '#93cf8e', '#a9d98f'], trunk: '#a98868', tuft: 'rgba(60,120,60,.35)',
    decor: 'forest', hides: ['fungo', 'ceppo', 'bush', 'rock'], tap: 'mushroom', fly: 'normal', ambient: 'leaves',
    animals: ['coniglietto', 'scoiattolo', 'volpe', 'cerbiatto', 'gufo'] },
  spazio: { name: 'Spazio', ground: 'space', orb: 'planet', noClouds: true,
    sky: { mattina: ['#5d62ad', '#c8a9e6'], pomeriggio: ['#414c9c', '#9183d2'], sera: ['#5b3f8c', '#e292b3'], notte: ['#20255a', '#4b509a'] },
    far: '#c3b3ea', mid: '#ad9ddc', front: ['#cbbdf0', '#ab9cdc'], trees: 'none', tuft: null,
    decor: 'craters', hides: ['razzo', 'ufo', 'pianetino', 'rock'], rock: ['#ddcdf5', '#ab9ad8', 'rgba(120,100,170,.45)'],
    tap: 'starlet', fly: 'float', animals: ['razzetto', 'ufetto', 'satellite', 'cometa', 'stellacadente'] },
  giurassico: { name: 'Giurassico', ground: 'hills', far: '#d3e3a2', mid: '#b9d791', front: ['#a7d08a', '#8cc176'],
    trees: 'palm', tree: ['#8fcf7a', '#a8d88a'], trunk: '#b8956f', tuft: 'rgba(90,140,60,.35)',
    decor: 'jurassic', hides: ['uovo', 'vulcano', 'felce', 'rock'], rock: ['#e2cfb2', '#bba487', 'rgba(150,120,90,.4)'],
    tap: 'flower', fly: 'normal', animals: ['brontosauro', 'triceratopo', 'trex', 'stegosauro', 'pterodattilo'] },
  giungla: { name: 'Giungla', ground: 'hills', far: '#a6dba6', mid: '#86cc90', front: ['#86cf88', '#68b977'],
    trees: 'jungle', tree: ['#6fc07e', '#86d08a', '#5fb574'], trunk: '#a98868', tuft: 'rgba(40,110,60,.4)',
    decor: 'jungle', hides: ['felce', 'tropicale', 'ceppo', 'rock'], rock: ['#cfd8c6', '#a6b69c', 'rgba(110,140,100,.45)'],
    tap: 'flower', fly: 'normal', animals: ['leopardo', 'scimmietta', 'elefantino', 'pappagallo', 'coccodrillo'] },
};
const LAND_KEYS = Object.keys(LANDS);

// primo livello: Prato di pomeriggio (come all'inizio); poi orario in sequenza e paesaggio dal sacchetto
let landKey = 'prato', timeIdx = 1;
let landBag = shuffle(LAND_KEYS.filter(k => k !== 'prato'));
function nextWorld() {
  timeIdx = (timeIdx + 1) % TIMES.length;
  if (!landBag.length) {
    landBag = shuffle(LAND_KEYS.slice());
    const last = landBag.length - 1;              // pesco dalla fine: mai lo stesso due volte di fila
    if (landBag[last] === landKey) [landBag[0], landBag[last]] = [landBag[last], landBag[0]];
  }
  landKey = landBag.pop();
}
function composeTheme() {
  const L = LANDS[landKey], Ti = TIMES[timeIdx];
  return Object.assign({}, L, {
    key: landKey, time: Ti, night: !!Ti.night,
    orb: L.orb || Ti.orb,
    sky: L.sky ? L.sky[Ti.key] : Ti.sky,
    cloud: L.noClouds ? null : Ti.cloud,
  });
}

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function rr(c, x, y, w, h, r) { // rounded rect path (works on older Safari too)
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function ell(c, x, y, rx, ry, rot) { c.beginPath(); c.ellipse(x, y, Math.max(.1, rx), Math.max(.1, ry), rot || 0, 0, Math.PI * 2); }
function circ(c, x, y, r) { c.beginPath(); c.arc(x, y, Math.max(.1, r), 0, Math.PI * 2); }
function starPath(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    const rad = i % 2 ? r * .48 : r;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}

// ---------- state ----------
let W = 0, H = 0, DPR = 1, R = 40, HORIZON = 0, bg = null;
let clouds = [], slots = [], pupi = [], gloves = [], parts = [], stars = [], texts = [], sprouts = [];
const sun = { x: 0, y: 0, r: 0, laugh: 0, bounce: 0, rot: 0 };
let started = false, hits = 0, time = 0;
let level = 0, levelHits = 0, transition = null, fillPop = -1, fillT = 0;
let T = composeTheme();
let nightStars = [], flakes = [], fireflies = [];
let bubbles = [], leaves = [], nebulae = [], animals = [], animalTimer = 3, lastSay = -9;
// stella magica: passa ogni tanto, se la prendi → arcobaleno
const MAGIC_EVERY = [50, 60];       // secondi (reali) tra una stella magica e l'altra
let magic = null, magicTimer = rand(...MAGIC_EVERY), rainbow = null, starRain = 0;
const RAINBOW = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff'];

// =========================================================
//  AUDIO — tutto generato nel codice, nessun file esterno
// =========================================================
let ac = null, master = null, noiseBuf = null, muted = false;

function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  const comp = ac.createDynamicsCompressor(); // protegge le orecchie dai picchi
  master = ac.createGain();
  master.gain.value = 0.7;
  master.connect(comp); comp.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
const canPlay = () => ac && !muted;
function env(g, t0, a, d, vol) {
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + a + d);
}
let sndStretch = 1; // >1 = suono più lungo e disteso (usato per i versi degli animali)
function tone(f0, f1, dur, type, vol, delay) {
  if (!canPlay()) return;
  dur *= sndStretch; delay = (delay || 0) * sndStretch;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t0);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  env(g, t0, 0.01, dur, vol || 0.2);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, f0, f1, vol, type, delay) {
  if (!canPlay()) return;
  dur *= sndStretch; delay = (delay || 0) * sndStretch;
  const t0 = ac.currentTime + (delay || 0);
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type || 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = ac.createGain(); env(g, t0, 0.02, dur, vol);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t0); s.stop(t0 + dur + 0.05);
}
const sfx = {
  boing() {
    if (!canPlay()) return;
    const t0 = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain(), l = ac.createOscillator(), lg = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(130, t0); o.frequency.exponentialRampToValueAtTime(560, t0 + 0.45);
    l.frequency.value = 16; lg.gain.value = 55; l.connect(lg); lg.connect(o.frequency);
    env(g, t0, 0.01, 0.5, 0.3);
    o.connect(g); g.connect(master);
    o.start(t0); l.start(t0); o.stop(t0 + 0.6); l.stop(t0 + 0.6);
  },
  whoosh() { noise(0.16, 500, 2600, 0.16); },
  thump() { tone(170, 55, 0.18, 'sine', 0.45); noise(0.08, 900, 300, 0.2, 'lowpass'); },
  giggle(p, vol) {
    for (let i = 0; i < 6; i++) {
      const f = p * (i % 2 ? 1.12 : 1) * (1 - i * 0.03);
      tone(f * 1.15, f, 0.07, 'triangle', vol || 0.14, i * 0.09);
    }
  },
  cucu() { tone(784, 784, 0.16, 'sine', 0.25); tone(622, 622, 0.26, 'sine', 0.25, 0.2); },
  pop() { tone(300, 900, 0.09, 'triangle', 0.2); },
  down() { tone(700, 260, 0.18, 'triangle', 0.12); },
  toc() { tone(260, 170, 0.07, 'triangle', 0.25); tone(200, 140, 0.07, 'triangle', 0.18, 0.09); },
  note() { const f = pick([523, 587, 659, 784, 880, 1047]); tone(f, f, 0.4, 'sine', 0.14); tone(f * 2, f * 2, 0.25, 'sine', 0.04); },
  twinkle() { tone(1568, 1568, 0.15, 'sine', 0.07); tone(2093, 2093, 0.2, 'sine', 0.06, 0.07); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, i === 3 ? 0.5 : 0.14, 'triangle', 0.18, i * 0.12)); },
  magic() { // scala che sale + luccichio
    [523, 659, 784, 988, 1175, 1319, 1568, 2093].forEach((f, i) => { tone(f, f, 0.35, 'sine', 0.13, i * 0.07); tone(f * 2, f * 2, 0.2, 'sine', 0.03, i * 0.07); });
    noise(0.8, 3000, 8000, 0.04, 'highpass', 0.1);
  },
  chime() { tone(1319, 1319, 0.3, 'sine', 0.08); tone(1760, 1760, 0.3, 'sine', 0.06, 0.12); },
};
// ---------- voce: solo 3 frasi ('Bravo Lolo!', 'Bravissimo Lolo!', 'Wow!'); gli animali fanno solo i versi ----------
// 1) Registrazione vera (papà/mamma) se c'è: metti qui la frase e il file audio nella stessa cartella, es.
//      const VOICE_CLIPS = { 'Bravo Lolo!': 'bravo-lolo.mp3', 'Bravissimo Lolo!': 'bravissimo.mp3', 'Wow!': 'wow.mp3' };
// 2) Altrimenti voce del dispositivo: italiana → spagnola → inglese (solo per "Wow!"), con tono naturale.
const VOICE_CLIPS = {};
const clipCache = {};
let voiceIt = null, voiceEs = null, voiceEn = null;
function pickVoices() {
  if (!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  const best = re => {
    const vs = all.filter(v => re.test(v.lang));
    const score = v => (/natural|neural|enhanced|premium/i.test(v.name) ? 8 : 0) + (/google/i.test(v.name) ? 4 : 0) + (v.localService ? 1 : 0);
    return vs.sort((a, b) => score(b) - score(a))[0] || null;
  };
  voiceIt = best(/^it([-_]|$)/i); voiceEs = best(/^es([-_]|$)/i); voiceEn = best(/^en([-_]|$)/i);
}
if ('speechSynthesis' in window) {
  pickVoices();
  if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoices); // le voci arrivano in ritardo
}
function speak(text) {
  if (muted) return;
  const src = VOICE_CLIPS[text];
  if (src) { // registrazione vera
    try {
      const a = clipCache[text] || (clipCache[text] = new Audio(src));
      a.currentTime = 0; a.volume = 1;
      const p = a.play(); if (p && p.catch) p.catch(() => {});
    } catch (e) {}
    return;
  }
  if (!('speechSynthesis' in window)) return;
  if (!voiceIt && !voiceEs && !voiceEn) pickVoices();
  const isWow = text === 'Wow!';
  const v = voiceIt || voiceEs || (isWow ? voiceEn : null);
  if (!v) return; // nessuna voce adatta: meglio il silenzio che una pronuncia sbagliata
  // "Wow" scritto come si pronuncia: le voci italiane/spagnole altrimenti dicono "vou"
  // ...e con la vocale allungata, per un "wooow" lungo e meravigliato
  const say = isWow ? (v === voiceEn ? 'Wooow!' : 'Uaau!') : text;
  try {
    const u = new SpeechSynthesisUtterance(say);
    u.voice = v; u.lang = v.lang;
    u.rate = isWow ? 0.7 : 0.9; u.pitch = 1.0; u.volume = 1; // tono naturale, il wow più lento
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { /* voce non disponibile: pazienza */ }
}

// =========================================================
//  LAYOUT
// =========================================================
function hillY(base, amp, freq, ph, x) {
  return base + Math.sin(x / W * Math.PI * freq + ph) * amp + Math.sin(x / W * Math.PI * freq * 2.7 + ph * 1.3) * amp * 0.35;
}
const HILLS = {
  far:   { base: .50, amp: .035, freq: 2.3, ph: .7 },
  mid:   { base: .56, amp: .040, freq: 1.6, ph: 2.1 },
  front: { base: .63, amp: .022, freq: 1.1, ph: 4.0 },
};
function hy(h, x) { return hillY(H * h.base, H * h.amp, h.freq, h.ph, x); }

function layout() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  R = Math.max(26, Math.min(W, H) * 0.075);
  HORIZON = H * HILLS.front.base;

  T = composeTheme();
  T.cast = T.animals ? shuffle(T.animals.slice()).slice(0, 3) : null; // 3 dei 5, a caso
  sun.r = R * 1.2;
  if (T.orb === 'planet') { sun.x = W * .78; sun.y = Math.max(sun.r * 1.8, H * .2); }
  else { sun.x = W * T.time.sx; sun.y = T.time.sy ? H * T.time.sy : Math.max(sun.r * 1.7, H * 0.15); }

  clouds = [];
  if (T.cloud) for (let i = 0; i < 5; i++) clouds.push({ x: rand(0, W), y: rand(.05, .3) * H, s: R * rand(.7, 1.15), v: rand(6, 16) });

  nightStars = []; flakes = []; fireflies = []; bubbles = []; leaves = []; nebulae = []; animals = [];
  animalTimer = rand(2, 4);
  if ((T.night && T.ground !== 'sea') || T.ground === 'space')
    for (let i = 0; i < 45; i++) nightStars.push({ x: rand(0, W), y: rand(0, HORIZON * .85), s: rand(1, 2.6), ph: rand(0, 6) });
  if (T.night && T.ground !== 'space') { // lucciole (sott'acqua: plancton che brilla)
    const minY = T.ground === 'sea' ? 0 : HORIZON;
    for (let i = 0; i < 12; i++) fireflies.push({ x: rand(0, W), y: rand(minY, H), minY, ph: rand(0, 6), vx: rand(-12, 12), vy: rand(-8, 8) });
  }
  if (T.ground === 'space') for (let i = 0; i < 3; i++) nebulae.push({ x: rand(.1, .9) * W, y: rand(.05, .45) * H, r: R * rand(3, 5), c: pick(['255,170,220', '150,230,255', '200,170,255']) });
  if (T.snow) for (let i = 0; i < 55; i++) flakes.push({ x: rand(0, W), y: rand(0, H), s: rand(1.5, 4), v: rand(15, 35), ph: rand(0, 6) });
  if (T.ambient === 'bubbles') for (let i = 0; i < 35; i++) bubbles.push({ x: rand(0, W), y: rand(0, H), s: rand(2, 6), v: rand(18, 40), ph: rand(0, 6) });
  if (T.ambient === 'leaves') for (let i = 0; i < 12; i++) leaves.push({ x: rand(0, W), y: rand(0, H), v: rand(12, 25), rot: rand(0, 6), ph: rand(0, 6), c: pick(['#ffc46b', '#ff9f6b', '#b5d96b', '#f5d46b']) });

  // posti dove compaiono i pupazzetti: 2 file sfalsate
  slots = []; pupi = []; gloves = []; parts = []; texts = []; sprouts = []; stars = [];
  const cols = W / H > 1.25 ? 4 : 3;
  [{ fy: .74, n: cols, off: .5 }, { fy: .9, n: cols - 1, off: 1 }].forEach(row => {
    for (let i = 0; i < row.n; i++) {
      const fy = row.fy + rand(-.012, .012);
      slots.push({
        x: W * (i + row.off) / cols + rand(-.03, .03) * W,
        y: H * fy,
        scale: 0.85 + 0.35 * (fy - .72) / .18,
        hide: null, pupo: null, wob: 0, cool: rand(.3, 2.5),
      });
    }
  });
  // circa metà dei posti hanno un nascondiglio
  const idx = shuffle([...slots.keys()]);
  const types = shuffle(T.hides.concat(T.hides));
  const nh = Math.ceil(slots.length * 0.55);
  for (let k = 0; k < nh; k++) slots[idx[k]].hide = types[k];
  slots.sort((a, b) => a.y - b.y); // ordine di profondità

  renderBG();
}

function renderBG() {
  bg = document.createElement('canvas');
  bg.width = Math.round(W * DPR); bg.height = Math.round(H * DPR);
  const b = bg.getContext('2d');
  b.setTransform(DPR, 0, 0, DPR, 0, 0);

  const hill = (h, fill) => {
    b.beginPath(); b.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) b.lineTo(x, hy(h, x));
    b.lineTo(W, H); b.closePath(); b.fillStyle = fill; b.fill();
  };

  // banco di nuvole (mondo Nuvole): tante palle morbide lungo la linea della collina
  const puffs = (h, fill, size) => {
    hill(h, fill);
    b.fillStyle = fill; b.beginPath();
    for (let x = -size; x <= W + size; x += size * 1.1) {
      const y = hy(h, x) + size * .35, rr0 = size * (0.8 + 0.3 * Math.sin(x * 0.05));
      b.moveTo(x + rr0, y); b.arc(x, y, rr0, 0, Math.PI * 2);
    }
    b.fill();
  };
  const frontFill = () => {
    const g = b.createLinearGradient(0, HORIZON - 20, 0, H);
    g.addColorStop(0, T.front[0]); g.addColorStop(1, T.front[1]);
    return g;
  };
  const yIn = (top) => rand(top, H); // una y tra la collina e il fondo

  // ---- terreno ----
  if (T.ground === 'clouds') {
    puffs(HILLS.far, T.far, R * .9);
    puffs(HILLS.mid, T.mid, R * 1.0);
    puffs(HILLS.front, frontFill(), R * 1.2);
  } else if (T.ground === 'beach') {
    const sea = b.createLinearGradient(0, H * .47, 0, H);
    sea.addColorStop(0, '#9fdcf2'); sea.addColorStop(1, '#5fbfe0');
    b.fillStyle = sea; b.fillRect(0, H * .47, W, H);
    b.strokeStyle = 'rgba(255,255,255,.6)'; b.lineWidth = 2; b.lineCap = 'round';
    for (let i = 0; i < 14; i++) { // onde
      const x = rand(0, W), y = rand(H * .49, H * .55), w = R * rand(.4, .8);
      b.beginPath(); b.moveTo(x - w, y); b.quadraticCurveTo(x - w / 2, y - 4, x, y); b.quadraticCurveTo(x + w / 2, y - 4, x + w, y); b.stroke();
    }
    hill(HILLS.mid, '#efdcae');                          // sabbia bagnata
    b.strokeStyle = 'rgba(255,255,255,.85)'; b.lineWidth = 4; // schiuma
    b.beginPath(); for (let x = 0; x <= W + 10; x += 10) { const y = hy(HILLS.mid, x) + Math.sin(x * .05) * 2; x ? b.lineTo(x, y) : b.moveTo(x, y); } b.stroke();
    hill(HILLS.front, frontFill());
  } else {
    hill(HILLS.far, T.far);
    // alberi / coralli sullo sfondo
    const nTrees = T.trees === 'forest' || T.trees === 'jungle' ? 14 : T.trees === 'none' ? 0 : 7;
    for (let i = 0; i < nTrees; i++) {
      const x = rand(.03, .97) * W, y = hy(HILLS.far, x) + 4;
      const big = T.trees === 'forest' || T.trees === 'jungle';
      const s = R * rand(.22, .34) * (big ? 1.4 : 1);
      const style = T.trees === 'jungle' ? (i % 2 ? 'palm' : 'lollipop') : T.trees === 'forest' ? 'lollipop' : T.trees;
      if (style === 'palm') drawPalm(b, x, y, s * 1.2);
      else {
        b.fillStyle = T.trunk || pick(T.tree); b.fillRect(x - s * .12, y - s * 1.6, s * .24, s * 1.6);
        b.fillStyle = pick(T.tree); circ(b, x, y - s * 1.9, s * .75); b.fill();
        if (style === 'coral') { circ(b, x - s * .6, y - s * 1.3, s * .4); b.fill(); circ(b, x + s * .6, y - s * 1.4, s * .45); b.fill(); }
        if (T.snow) { b.fillStyle = '#ffffff'; ell(b, x, y - s * 2.4, s * .55, s * .28); b.fill(); }
      }
    }
    if (T.decor === 'jurassic') for (let i = 0; i < 2; i++) { const vx = rand(.1, .9) * W; drawVolcano(b, vx, hy(HILLS.far, vx) + 10, R * rand(.9, 1.3)); }
    if (T.decor === 'farm') { const bx = rand(.15, .85) * W; drawBarn(b, bx, hy(HILLS.far, bx) + 8, R * .6); }
    hill(HILLS.mid, T.mid);
    if (T.decor === 'farm') { // staccionata lungo la collina di mezzo
      b.strokeStyle = '#fffaf0'; b.lineWidth = Math.max(2, R * .06); b.lineCap = 'round';
      for (let x = R * .3; x < W; x += R * 1.1) { const y = hy(HILLS.mid, x) + R * .15; b.beginPath(); b.moveTo(x, y); b.lineTo(x, y - R * .55); b.stroke(); }
      for (const dy of [.2, .42]) { b.beginPath(); for (let x = 0; x <= W + 10; x += 10) { const y = hy(HILLS.mid, x) + R * .15 - R * dy; x ? b.lineTo(x, y) : b.moveTo(x, y); } b.stroke(); }
    }
    if (T.trees === 'palm' && T.ground !== 'beach') for (let i = 0; i < 3; i++) { const x = rand(.05, .95) * W; drawPalm(b, x, hy(HILLS.mid, x) + 6, R * rand(.4, .55)); }
    hill(HILLS.front, frontFill());
  }
  if (T.ground === 'beach') { drawPalm(b, W * .04, hy(HILLS.front, W * .04) + R * .4, R * .8); drawPalm(b, W * .96, hy(HILLS.front, W * .96) + R * .4, R * .75); }

  // ---- ciuffi d'erba ----
  if (T.tuft) {
    b.strokeStyle = T.tuft; b.lineWidth = 2; b.lineCap = 'round';
    const tufts = Math.min(140, W * H / 9000);
    for (let i = 0; i < tufts; i++) {
      const x = rand(0, W), y = rand(HORIZON + 10, H), s = 4 + 8 * (y / H);
      b.beginPath();
      b.moveTo(x - s * .5, y - s); b.lineTo(x, y); b.lineTo(x + s * .5, y - s);
      b.moveTo(x, y); b.lineTo(x, y - s * 1.2); b.stroke();
    }
  }

  // ---- decorazioni ----
  const flowers = (density, colors) => {
    const nf = Math.min(170, W * H / 6500) * density;
    for (let i = 0; i < nf; i++) {
      const x = rand(0, W), y = yIn(hy(HILLS.mid, x) + 6), s = 2 + 6 * (y / H);
      b.fillStyle = pick(colors || FLOWER_COLORS);
      for (let k = 0; k < 5; k++) { const a = k * Math.PI * .4; circ(b, x + Math.cos(a) * s, y + Math.sin(a) * s, s * .7); b.fill(); }
      b.fillStyle = '#ffd34d'; circ(b, x, y, s * .55); b.fill();
    }
  };
  const scatter = (n, top, fn) => { for (let i = 0; i < n; i++) { const x = rand(0, W), y = yIn(top), s = 3 + 9 * (y / H); fn(x, y, s); } };
  switch (T.decor) {
    case 'flowers': flowers(1); break;
    case 'snow': // mucchietti luccicanti
      scatter(40, HORIZON + 10, (x, y, s) => {
        b.fillStyle = 'rgba(200,220,240,.6)'; ell(b, x, y + s * .2, s * 1.6, s * .5); b.fill();
        b.fillStyle = '#ffffff'; ell(b, x, y, s * 1.4, s * .45); b.fill();
      });
      break;
    case 'farm': flowers(.6); break;
    case 'forest':
      flowers(.35);
      scatter(18, HORIZON + 10, (x, y, s) => { // funghetti
        b.fillStyle = '#fff3dc'; b.fillRect(x - s * .2, y - s * .7, s * .4, s * .7);
        b.fillStyle = pick(['#ff8f9f', '#ffb36b']); b.beginPath(); b.ellipse(x, y - s * .7, s * .7, s * .5, 0, Math.PI, Math.PI * 2); b.fill();
        b.fillStyle = '#fff'; circ(b, x - s * .25, y - s * .95, s * .1); b.fill(); circ(b, x + s * .2, y - s * .85, s * .08); b.fill();
      });
      break;
    case 'jurassic':
      flowers(.3, ['#ffd38a', '#ffadc2', '#fff3a0']);
      scatter(16, HORIZON + 10, (x, y, s) => drawFern(b, x, y, s * 1.4));
      break;
    case 'jungle':
      scatter(16, HORIZON + 10, (x, y, s) => drawFern(b, x, y, s * 1.5));
      scatter(18, HORIZON + 10, (x, y, s) => { // fiori tropicali
        b.fillStyle = pick(['#ff7fa6', '#ffa25a', '#ffd34d', '#c58bff']);
        for (let k = 0; k < 5; k++) { const a = k * Math.PI * .4; ell(b, x + Math.cos(a) * s * .8, y + Math.sin(a) * s * .8, s * .75, s * .45, a); b.fill(); }
        b.fillStyle = '#fff3a0'; circ(b, x, y, s * .4); b.fill();
      });
      break;
    case 'seabed':
      scatter(26, hy(HILLS.mid, W / 2) + 4, (x, y, s) => { // alghe
        b.strokeStyle = pick(['#3fa38a', '#5cc4a4', '#7fcf86']); b.lineWidth = s * .35; b.lineCap = 'round';
        b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x - s, y - s * 2, x, y - s * 3.2); b.quadraticCurveTo(x + s * .8, y - s * 4, x + s * .2, y - s * 4.8); b.stroke();
      });
      scatter(22, HORIZON + 10, (x, y, s) => { b.fillStyle = pick(['#ffc6d2', '#fff3dc', '#ffd59e']); ell(b, x, y, s * .6, s * .4); b.fill(); });
      break;
    case 'sand':
      scatter(20, HORIZON + 10, (x, y, s) => { b.fillStyle = pick(['#ffc6d2', '#fff3dc', '#ffd59e']); ell(b, x, y, s * .6, s * .4); b.fill(); });
      scatter(8, HORIZON + 10, (x, y, s) => { b.fillStyle = pick(['#ffa77a', '#ff8fb1']); starPath(b, x, y, s * .9, rand(0, 1)); b.fill(); });
      break;
    case 'sparkle':
      scatter(30, HORIZON, (x, y, s) => { b.fillStyle = pick(['#fff3a8', '#ffd6e6', '#cfe6ff']); starPath(b, x, y, s * .6, 0); b.fill(); });
      break;
    case 'craters':
      scatter(22, HORIZON + 10, (x, y, s) => {
        b.fillStyle = 'rgba(110,90,170,.3)'; ell(b, x, y, s * 1.6, s * .55); b.fill();
        b.fillStyle = 'rgba(255,255,255,.35)'; ell(b, x, y - s * .2, s * 1.2, s * .3); b.fill();
      });
      break;
  }

  // ---- liane in alto (Giungla) ----
  if (T.decor === 'jungle') {
    for (let i = 0; i < 6; i++) {
      const x = rand(.02, .98) * W, len = H * rand(.08, .22);
      b.strokeStyle = '#5fae6a'; b.lineWidth = Math.max(2, R * .07); b.lineCap = 'round';
      b.beginPath(); b.moveTo(x, -5); b.quadraticCurveTo(x + R * .4, len * .5, x, len); b.stroke();
      b.fillStyle = '#7fcf86';
      for (let k = 1; k <= 4; k++) { const yy = len * k / 4.5; ell(b, x + (k % 2 ? 1 : -1) * R * .15, yy, R * .14, R * .07, k % 2 ? .6 : -.6); b.fill(); }
    }
  }

  // ---- luce dell'orario sul paesaggio (solo sul terreno: il cielo resta trasparente) ----
  if (T.time.tint && T.ground !== 'space') {
    b.globalCompositeOperation = 'source-atop';
    b.fillStyle = T.time.tint; b.fillRect(0, 0, W, H);
    b.globalCompositeOperation = 'source-over';
  }
}

// ---------- pezzi di sfondo riutilizzabili ----------
function drawPalm(c, x, y, s) {
  c.strokeStyle = '#c9a27a'; c.lineWidth = s * .22; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + s * .1, y - s * 1.2, x + s * .4, y - s * 2.2); c.stroke();
  const tx = x + s * .4, ty = y - s * 2.2;
  c.fillStyle = '#6cc07a';
  for (let k = 0; k < 6; k++) { const a = -Math.PI / 2 + (k - 2.5) * .55; ell(c, tx + Math.cos(a) * s * .55, ty + Math.sin(a) * s * .35 + s * .15, s * .6, s * .16, a); c.fill(); }
  c.fillStyle = '#a97c52'; circ(c, tx - s * .08, ty + s * .12, s * .1); c.fill(); circ(c, tx + s * .1, ty + s * .14, s * .1); c.fill();
}
function drawFern(c, x, y, s) {
  c.strokeStyle = pick(['#4fa86a', '#66bd7c', '#7fcf86']); c.lineWidth = Math.max(1.5, s * .18); c.lineCap = 'round';
  for (let k = -2; k <= 2; k++) { c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + k * s * .5, y - s * 1.2, x + k * s * .9, y - s * (1.3 - Math.abs(k) * .25)); c.stroke(); }
}
function drawVolcano(c, x, y, s) {
  c.fillStyle = '#c9a98f';
  c.beginPath(); c.moveTo(x - s * 1.4, y); c.lineTo(x - s * .35, y - s * 1.3); c.lineTo(x + s * .35, y - s * 1.3); c.lineTo(x + s * 1.4, y); c.closePath(); c.fill();

    o(col, x, y, r) { c.fillStyle = col; circ(c, S(x), S(y), S(r)); c.fill(); },
    b(col, x, y, w, h, rad) { c.fillStyle = col; rr(c, S(x), S(y), S(w), S(h), S(rad == null ? Math.min(w, h) * .4 : rad)); c.fill(); },
    p(col, pts) { c.fillStyle = col; c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(S(x), S(y)) : c.moveTo(S(x), S(y))); c.closePath(); c.fill(); },
    l(col, w, pts) {

// ---------- movimento ----------
const ANIMAL_SCALE = 2.3; // grandezza degli animaletti sullo sfondo
const KINDS = { walk: .9, hop: .9, crawl: .4, fly: 2, swim: 1.2, float: .55, boat: .45, fast: 5 };
const isGround = kind => kind === 'walk' || kind === 'hop' || kind === 'crawl';
function spawnAnimal() {
  if (!T.cast || !T.cast.length) return;
  const type = pick(T.cast), A = ANIMALS[type]; // a caso: ogni tanto ne arrivano due uguali, va bene così
  if (!A) return;
  const dir = Math.random() < .5 ? 1 : -1, s = R * A.size * ANIMAL_SCALE;
  const a = { type, A, dir, s, t: 0, x: dir > 0 ? -s * 2.5 : W + s * 2.5, y: 0, base: 0, vy: 0, hop: 0, called: false, gone: false,
    col: A.kind === 'swim' ? pick(FISH_COLORS) : pick(RAINBOW) };
  if (A.kind === 'fly') a.base = rand(H * .1, HORIZON - R * 2.2);
  else if (A.kind === 'float') a.base = rand(H * .12, HORIZON - R * 2.5);
  else if (A.kind === 'swim') a.base = rand(H * .15, HORIZON - R);
  else if (A.kind === 'boat') a.base = H * .505;
  else if (A.kind === 'fast') { a.base = rand(H * .04, H * .2); a.vy = R * 1.2; }
  a.y = a.base;
  animals.push(a);
}
function updateAnimals(dt, realDt) {
  if (T.cast && !transition) {
    animalTimer -= realDt;
    if (animalTimer <= 0) { if (animals.length < (T.maxAnimals || 2)) spawnAnimal(); animalTimer = rand(5, 10); }
  }
  for (const a of animals) {
    a.t += dt;
    const kind = a.A.kind;
    a.x += a.dir * KINDS[kind] * R * dt;
    if (isGround(kind)) a.y = hy(HILLS.mid, a.x) + R * .08;
    else if (kind === 'fly') a.y = a.base + Math.sin(a.t * 1.6) * R * .35;
    else if (kind === 'float') a.y = a.base + Math.sin(a.t * 1.1) * R * .25;
    else if (kind === 'swim') a.y = a.base + Math.sin(a.t * (a.type === 'delfino' ? 2 : 1.4)) * R * (a.type === 'delfino' ? .6 : .3);
    else if (kind === 'boat') a.y = a.base + Math.sin(a.t * 2) * R * .05;
    else if (kind === 'fast') { a.base += a.vy * dt; a.y = a.base; if (Math.random() < .3) parts.push({ x: a.x, y: a.y, vx: 0, vy: 0, life: .5, max: .5, c: pick(RAINBOW), s: R * .08, star: true, rot: 0, g: 0 }); }
    a.hop = Math.max(0, a.hop - realDt * 1.6);
    if (!a.called && a.t > 1.2) { a.called = true; if (started) animalSound(a.A, .45); } // un verso quando arriva
    if (a.x < -a.s * 4 || a.x > W + a.s * 4 || a.y > H) a.gone = true;
  }
  animals = animals.filter(a => !a.gone);
}
function animalCenter(a) { return { x: a.x, y: a.y - (isGround(a.A.kind) || a.A.kind === 'boat' ? a.s * .55 : 0) }; }
function hitAnimal(x, y) {
  for (const a of animals) {
    const c = animalCenter(a);
    if (Math.hypot(x - c.x, y - c.y) < Math.max(R * .9, a.s * 1.25)) return a;
  }
  return null;
}
function tapAnimal(a) {
  a.hop = 1; animalSound(a.A, 1);
  const c = animalCenter(a);
  for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4; parts.push({ x: c.x, y: c.y, vx: Math.cos(an) * 120, vy: Math.sin(an) * 120 - 40, life: .7, max: .7, c: pick(RAINBOW), s: R * .12, star: true, rot: 0, g: 100 }); }
}
function drawAnimals() {
  for (const a of animals) {
    let oy = 0;
    if (a.A.kind === 'hop') oy = -Math.abs(Math.sin(a.t * 5)) * a.s * .4;
    if (a.hop > 0) oy -= Math.sin((1 - a.hop) * Math.PI) * a.s * .9;
    ctx.save();
    ctx.translate(a.x, a.y + oy);
    if (a.A.waddle) ctx.rotate(Math.sin(a.t * 6) * .1);
    ctx.scale(a.dir, 1);
    a.A.draw(pen(ctx, a.s), a.t, a, ctx, a.s);
    ctx.restore();
  }
}

// =========================================================
//  PUPAZZETTI
// =========================================================
const slotR = s => R * s.scale;

function spawn(s) {
  const r = slotR(s);
  const p = {
    slot: s, r, color: pick(PUPI_COLORS), ant: pick(ANTENNAS), shape: pick(SHAPE_NAMES),
    acc: pick(ACCESSORIES), accC: pick(ACC_COLORS),
    x: s.x, y: 0, v: 0, vx: 0, vy: 0, rot: 0, vr: 0,
    ph: rand(0, 6), blink: rand(1, 4), blinkT: 0,
    peek: 0, peekT: rand(1.5, 4), peekLeft: 0, upT: 0, sc: 1, squash: 0,
    pitch: rand(700, 1000), trail: 0, gone: false,
  };
  if (s.hide) { p.state = 'hidden'; p.y = s.y - 0.2 * r; }
  else { p.state = 'appear'; p.y = s.y - r; p.sc = 0; if (started) sfx.pop(); }
  s.pupo = p; pupi.push(p);
}

function updatePupo(p, dt) {
  const s = p.slot, r = p.r;
  p.blink -= dt; p.blinkT -= dt;
  if (p.blink <= 0) { p.blinkT = 0.12; p.blink = rand(2, 5); }
  p.squash = Math.max(0, p.squash - dt * 4);

  switch (p.state) {
    case 'hidden': {
      p.peekT -= dt;
      if (p.peekT <= 0) {
        p.peekLeft = 1.3; p.peekT = rand(3, 7);
        if (started) sfx.giggle(p.pitch * 1.2, 0.05); // risatina da dietro
      }
      p.peekLeft -= dt;
      const goal = p.peekLeft > 0 ? 1 : 0;
      p.peek += (goal - p.peek) * Math.min(1, dt * 8);
      p.y = (s.y - 0.2 * r) - p.peek * 2.1 * r;
      break;
    }
    case 'up': {
      const target = s.y - 2.9 * r;
      p.v += (target - p.y) * 160 * dt;
      p.v *= Math.exp(-8 * dt);
      p.y += p.v * dt;
      p.upT += dt;
      if (p.upT > 8) { // si stanca e torna a nascondersi
        p.state = 'hidden';
        p.peek = clamp(((s.y - 0.2 * r) - p.y) / (2.1 * r), 0, 1.4);
        p.peekLeft = 0; p.peekT = rand(2, 5);
        if (started) sfx.down();
      }
      break;
    }
    case 'appear':
      p.sc = Math.min(1, p.sc + dt * 4);
      if (p.sc >= 1) p.state = 'idle';
      break;
    case 'flying':
      if (T.fly === 'bubble') { // la bolla sale piano
        p.vy = Math.max(p.vy - H * .5 * dt, -H * .55); p.vx *= Math.exp(-.8 * dt);
        p.x += Math.sin(time * 3 + p.ph) * R * .4 * dt;
      } else if (T.fly === 'float') p.vy += H * .25 * dt; // poca gravità
      else p.vy += H * 2.2 * dt;
      if (T.fly === 'bounce' && !p.bounced && p.vy > 0 && p.y > s.y - r) { // boing sulla nuvola!
        p.bounced = true; p.vy = -H * 1.45; p.y = s.y - r; p.squash = 1; sfx.boing();
        for (let k = 0; k < 10; k++) { const a = rand(Math.PI, Math.PI * 2); parts.push({ x: p.x, y: s.y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 60, life: .7, max: .7, c: '#ffffff', s: R * .3, star: false, rot: 0, g: 0 }); }
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      p.trail -= dt;
      if (p.trail <= 0) {
        p.trail = 0.05;
        parts.push({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-30, 30), life: .5, max: .5, c: pick(FLOWER_COLORS), s: R * .12, star: true, rot: rand(0, 6), g: 0 });
      }
      if (p.x < -p.r * 3 || p.x > W + p.r * 3 || p.y > H + p.r * 3 || p.y < -p.r * 4) {
        p.gone = true;
        // diventa una stellina in cielo
        stars.push({ x: rand(.06, .94) * W, y: rand(.05, .9) * (HORIZON - R), c: p.color.body, s: R * rand(.16, .26), t: 0, ph: rand(0, 6) });
        if (stars.length > 40) stars.shift();
        sfx.twinkle();
      }
      break;
    case 'leave': // fine livello: salutano e volano su piano piano
      p.leaveDelay -= dt;
      if (p.leaveDelay > 0) break;
      p.vy = Math.max(p.vy - H * .9 * dt, -H * .45);
      p.y += p.vy * dt;
      p.x += Math.sin(time * 2 + p.ph) * R * .6 * dt;
      if (p.y < -p.r * 3) p.gone = true;
      break;
    // 'idle' e 'targeted': nessun movimento extra
  }
}

function startLevelUp() {
  transition = { t: 0, switched: false };
  const next = level + 2; // numero mostrato (il livello 0 è "Livello 1")
  texts.push({ s: `Livello ${next}! 🌈`, x: W / 2, y: H * .34, t: 0, life: 3.2, c: '#a98bff', size: R * 1.1, rot: 0 });
  sfx.fanfare(); setTimeout(sfx.fanfare, 700);
  setTimeout(() => speak('Bravissimo Lolo!'), 500);
  let k = 0;
  for (const p of pupi) {
    if (p.state === 'flying' || p.state === 'targeted') continue;
    p.state = 'leave'; p.vy = 0; p.leaveDelay = .3 + k * .25;
    const d = p.leaveDelay;
    setTimeout(() => sfx.giggle(p.pitch, .1), d * 1000);
    if (p.slot.pupo === p) p.slot.pupo = null;
    k++;
  }
}

function punch(p) {
  if (p.state === 'targeted' || p.state === 'flying') return;
  p.state = 'targeted';
  const dir = p.x < W / 2 ? 1 : -1; // il guantone arriva dal lato più vicino e lo spinge dall'altra parte
  const s = R * 1.05;
  gloves.push({
    p, dir, s, y: p.y, t: 0, hit: false,
    sx: dir > 0 ? -s * 2.5 : W + s * 2.5,
    tx: p.x - dir * (p.r * 0.95 + s * 0.95),
  });
  sfx.whoosh();
}

function impact(g) {
  const p = g.p;
  if (!p || p.gone) return;
  p.state = 'flying';
  const VW = Math.max(W, 700);
  switch (T.fly) {
    case 'bubble': p.vx = g.dir * rand(.25, .35) * VW; p.vy = -H * .25; p.vr = g.dir * 1.5; p.bubble = true; SND.blub(1); break;
    case 'float':  p.vx = g.dir * rand(.4, .5) * VW;   p.vy = -H * .55; p.vr = g.dir * 2.5; break;
    case 'bounce': p.vx = g.dir * rand(.4, .5) * VW;   p.vy = -H * .5;  p.vr = g.dir * 6; break;
    default:       p.vx = g.dir * rand(.8, 1.15) * VW; p.vy = -rand(1.0, 1.35) * H; p.vr = g.dir * rand(7, 12);
  }
  p.squash = 1;
  const s = p.slot;
  if (s.pupo === p) { s.pupo = null; s.cool = rand(...SPD().cool); if (s.hide) s.wob = 0.6; }

  for (let i = 0; i < 16; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(150, 420);
    parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.6, 1), max: 1, c: pick(POW_COLORS.concat(FLOWER_COLORS)), s: R * rand(.1, .2), star: Math.random() < .6, rot: rand(0, 6), g: 500 });
  }
  texts.push({ s: pick(POWS), x: p.x, y: p.y - p.r * 1.4, t: 0, life: .9, c: pick(POW_COLORS), size: R * .8, rot: rand(-.2, .2) });

  sfx.thump(); sfx.boing(); setTimeout(() => sfx.giggle(p.pitch), 150);
  if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
  sun.laugh = 1.2; sun.bounce = 1;
  hits++;
  if (transition) return; // colpo arrivato durante il cambio livello: conta, ma non riempie
  levelHits++;
  fillPop = levelHits - 1; fillT = 0;
  if (levelHits >= HITS_PER_LEVEL) startLevelUp();
  else if (levelHits === Math.floor(HITS_PER_LEVEL / 2)) { // a metà strada
    texts.push({ s: 'Bravo Lolo! ⭐', x: W / 2, y: H * .34, t: 0, life: 2.2, c: '#ff8fb1', size: R * 1.0, rot: 0 });
    setTimeout(sfx.fanfare, 350);
    setTimeout(() => speak('Bravo Lolo!'), 900);
  }
}
