function inHide(s, x, y) {
  const r = slotR(s);
  return Math.abs(x - s.x) < 1.9 * r && y > s.y - 2.5 * r && y < s.y + 0.35 * r;
}

// ---------- stella magica ----------
function spawnMagic() {
  const dir = Math.random() < .5 ? 1 : -1;
  magic = {
    dir, x: dir > 0 ? -R : W + R,
    baseY: rand(H * .18, HORIZON - R * 1.5), y: 0,
    ph: rand(0, 6), rot: 0, s: R * .75, trail: 0, ding: 0,
  };
  sfx.chime();
}
function catchMagic() {
  const m = magic; magic = null;
  magicTimer = rand(...MAGIC_EVERY);
  rainbow = { t: 0 };
  starRain = 3; // secondi di pioggia di stelline
  for (let i = 0; i < 30; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(150, 450);
    parts.push({ x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(.8, 1.3), max: 1.3, c: pick(RAINBOW), s: R * rand(.14, .26), star: true, rot: rand(0, 6), g: 200 });
  }
  texts.push({ s: 'Wooow! 🌈', x: W / 2, y: H * .3, t: 0, life: 2.6, c: '#a98bff', size: R * 1.15, rot: 0 });
  sfx.magic();
  setTimeout(() => speak('Wow!'), 700);
  sun.laugh = 3; sun.bounce = 1;
  // tutti i pupazzetti escono a guardare e fanno festa
  pupi.forEach((p, i) => {
    if (p.state === 'hidden') { p.state = 'up'; p.upT = 0; p.v = -p.r * 6; p.slot.wob = 1; }
    if (p.state === 'idle' || p.state === 'up') p.squash = 1;
    setTimeout(() => sfx.giggle(p.pitch, .1), 300 + i * 200);
  });
}

function handleTap(x, y) {
  if (magic && !transition && Math.hypot(x - magic.x, y - magic.y) < R * 1.5) { catchMagic(); return; }
  if (transition) { // durante il cambio livello solo scintille
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; parts.push({ x, y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, life: .6, max: .6, c: pick(FLOWER_COLORS), s: R * .14, star: true, rot: 0, g: 0 }); }
    sfx.note(); return;
  }
  // 1) un pupazzetto visibile (quello più davanti vince)
  const cand = pupi.filter(p => p.state === 'idle' || p.state === 'up' || p.state === 'appear')
                   .sort((a, b) => b.slot.y - a.slot.y);
  for (const p of cand) {
    if (Math.hypot(x - p.x, y - p.y) < p.r * 1.6) { punch(p); return; }
  }
  // 2) un nascondiglio
  for (let i = slots.length - 1; i >= 0; i--) {
    const s = slots[i];
    if (!s.hide || !inHide(s, x, y)) continue;
    const p = s.pupo;
    if (p && p.state === 'hidden') { // cucù!
      p.state = 'up'; p.upT = 0; p.v = -slotR(s) * 6;
      s.wob = 1; sfx.cucu(); sfx.giggle(p.pitch, 0.1);
    } else if (p && p.state === 'up') {
      punch(p); // generoso: toccare il nascondiglio va bene lo stesso
    } else {
      s.wob = 1; sfx.toc();
      const pal = BLOB_PAL[s.hide];
      if (pal) for (let k = 0; k < 6; k++) parts.push({ x, y, vx: rand(-120, 120), vy: rand(-220, -60), life: .8, max: .8, c: pal[1], s: R * .12, star: false, rot: 0, g: 500 });
    }
    return;
  }
  // 3) un animaletto dello sfondo: fa il verso e dice il nome
  const an = hitAnimal(x, y);
  if (an) { tapAnimal(an); return; }
  // 4) il sole / la luna / il pianeta
  if (T.orb !== 'none' && Math.hypot(x - sun.x, y - sun.y) < sun.r * 1.4) {
    sun.laugh = 1.5; sun.bounce = 1; sfx.giggle(900, 0.14); return;
  }
  // 5) terreno: spunta qualcosa (dipende dal mondo) / cielo: scintille
  if (y > HORIZON) {
    if (T.tap === 'puff') { // nuvole: sbuffo morbido
      for (let k = 0; k < 10; k++) { const a = rand(0, Math.PI * 2); parts.push({ x, y, vx: Math.cos(a) * rand(40, 120), vy: Math.sin(a) * rand(40, 90) - 30, life: .9, max: .9, c: pick(['#ffffff', '#ffe3ef', '#e3efff']), s: R * rand(.25, .4), star: false, rot: 0, g: -20 }); }
    } else {
      sprouts.push({ x, y, t: 0, kind: T.tap, dir: Math.random() < .5 ? 1 : -1, c: pick(FLOWER_COLORS.filter(c => c !== '#ffffff')), s: R * rand(.22, .32) });
      if (sprouts.length > 30) sprouts.shift();
    }
  } else {
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4; parts.push({ x, y, vx: Math.cos(a) * 140, vy: Math.sin(a) * 140, life: .6, max: .6, c: pick(FLOWER_COLORS), s: R * .14, star: true, rot: 0, g: 0 }); }
  }
  sfx.note();
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!started) return;
  initAudio();
  handleTap(e.clientX, e.clientY);
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());

// =========================================================
//  UPDATE
// =========================================================
// tempi del guantone (in tempo di gioco): andata, colpo, ritorno — più lenti per non stimolare troppo
const G_EXT = .2, G_HOLD = .34, G_END = .72;
function gloveX(g) {
  let e;
  if (g.t < G_EXT) e = 1 - Math.pow(1 - g.t / G_EXT, 3);
  else if (g.t < G_HOLD) e = 1 + 0.12 * Math.sin((g.t - G_EXT) / (G_HOLD - G_EXT) * Math.PI);
  else { const k = (g.t - G_HOLD) / (G_END - G_HOLD); e = 1 - k * k; }
  return g.sx + (g.tx - g.sx) * e;
}

function update(realDt) {
  const dt = realDt * SPD().k; // rallentatore globale
  time += dt;

  // cambio livello (tempi reali, uguali a ogni velocità)
  if (transition) {
    transition.t += realDt;
    if (transition.t >= 3.8 && !transition.switched) {
      transition.switched = true;
      level++; levelHits = 0; fillPop = -1;
      nextWorld();
      layout(); // nuovo mondo
    }
    if (transition.t >= 4.6) transition = null;
  }

  // stella magica: arriva ogni 50-60 s di gioco
  if (started && !transition && !magic) { magicTimer -= realDt; if (magicTimer <= 0) spawnMagic(); }
  if (magic) {
    const m = magic;
    m.x += m.dir * W * .2 * dt;  // un po' più svelta dei pupazzetti
    m.y = m.baseY + Math.sin(time * 2.2 + m.ph) * H * .06;
    m.rot += dt * 2.5;
    m.trail -= dt;
    if (m.trail <= 0) { m.trail = .04; parts.push({ x: m.x - m.dir * m.s * .6, y: m.y, vx: rand(-20, 20), vy: rand(10, 40), life: .7, max: .7, c: pick(RAINBOW), s: R * .13, star: true, rot: rand(0, 6), g: 40 }); }
    m.ding -= realDt;
    if (m.ding <= 0) { m.ding = 1.5; sfx.chime(); }
    if (m.x < -R * 2 || m.x > W + R * 2) { magic = null; magicTimer = rand(...MAGIC_EVERY); } // scappata: tornerà
  }
  if (rainbow) { rainbow.t += realDt; if (rainbow.t > 8) rainbow = null; }
  if (starRain > 0) {
    starRain -= realDt;
    if (Math.random() < .5) parts.push({ x: rand(0, W), y: -10, vx: rand(-20, 20), vy: rand(80, 160), life: 3, max: 3, c: pick(RAINBOW), s: R * rand(.12, .22), star: true, rot: rand(0, 6), g: 30 });
  }

  for (const c of clouds) { c.x += c.v * dt; if (c.x - c.s * 3 > W) c.x = -c.s * 3; }
  sun.rot += dt * 0.25;
  sun.laugh = Math.max(0, sun.laugh - dt);
  sun.bounce = Math.max(0, sun.bounce - dt * 2.5);
  fillT += realDt;
  for (const f of flakes) { f.y += f.v * dt; f.x += Math.sin(time + f.ph) * 12 * dt; if (f.y > H + 5) { f.y = -5; f.x = rand(0, W); } }
  for (const q of bubbles) { q.y -= q.v * dt; q.x += Math.sin(time * 1.5 + q.ph) * 8 * dt; if (q.y < -10) { q.y = H + 10; q.x = rand(0, W); } }
  for (const q of leaves) { q.y += q.v * dt; q.x += Math.sin(time + q.ph) * 20 * dt; q.rot += dt * 1.5; if (q.y > H + 10) { q.y = -10; q.x = rand(0, W); } }
  for (const f of sprouts) if (f.kind === 'crab') f.x += f.dir * R * .9 * dt; // il granchietto scappa di lato
  updateAnimals(dt, realDt);
  for (const f of fireflies) {
    f.vx += rand(-20, 20) * dt; f.vy += rand(-20, 20) * dt;
    f.vx = clamp(f.vx, -18, 18); f.vy = clamp(f.vy, -12, 12);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 0 || f.x > W) f.vx *= -1;
    if (f.y < f.minY || f.y > H) f.vy *= -1;
  }

  const active = slots.filter(s => s.pupo).length;
  let room = SPD().maxActive - active;
  for (const s of slots) {
    s.wob = Math.max(0, s.wob - dt * 2.2);
    if (!s.pupo && !transition) {
      s.cool -= dt;
      if (s.cool <= 0) {
        if (room > 0) { spawn(s); room--; }
        else s.cool = rand(.5, 1.5); // c'è già abbastanza gente: riprova fra un po'
      }
    }
  }
  for (const p of pupi) updatePupo(p, dt);
  pupi = pupi.filter(p => !p.gone);

  for (const g of gloves) {
    if (!g.hit) g.y = g.p.y;
    g.t += dt;
    if (!g.hit && g.t >= G_EXT) { g.hit = true; impact(g); }
    if (g.t >= G_END) g.dead = true;
  }
  gloves = gloves.filter(g => !g.dead);

  for (const q of parts) { q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += dt * 4; q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const t of texts) t.t += realDt; // le scritte restano leggibili a ogni velocità
  texts = texts.filter(t => t.t < t.life);
  for (const s of stars) s.t += dt;
  for (const f of sprouts) f.t += dt;
  sprouts = sprouts.filter(f => f.t < 7);
}

// =========================================================
//  DISEGNO
// =========================================================
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  g.addColorStop(0, T.sky[0]); g.addColorStop(1, T.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const n of nebulae) { // nebulose colorate (Spazio)
    const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    ng.addColorStop(0, `rgba(${n.c},.32)`); ng.addColorStop(1, `rgba(${n.c},0)`);
    ctx.fillStyle = ng; circ(ctx, n.x, n.y, n.r); ctx.fill();
  }
  for (const s of nightStars) {
    ctx.globalAlpha = .55 + .45 * Math.sin(time * 1.5 + s.ph);
    ctx.fillStyle = '#fffbe0'; circ(ctx, s.x, s.y, s.s); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (T.ground === 'sea' && !T.night) { // raggi di luce dall'alto
    const tint = T.time.key === 'sera' ? '255,210,190' : '255,255,255';
    for (let i = 0; i < 5; i++) {
      const x0 = W * (.1 + i * .2) + Math.sin(time * .3 + i) * W * .03;
      ctx.fillStyle = `rgba(${tint},${.08 + .04 * Math.sin(time * .8 + i)})`;
      ctx.beginPath(); ctx.moveTo(x0 - W * .03, 0); ctx.lineTo(x0 + W * .03, 0); ctx.lineTo(x0 + W * .12, HORIZON); ctx.lineTo(x0, HORIZON); ctx.closePath(); ctx.fill();
    }
  }
}

function drawCloud(c) {
  const blobs = [[-1.1, .15, .7], [-.4, -.25, .9], [.45, -.15, .8], [1.1, .15, .65], [0, .2, .8]];
  if (T.night) ctx.globalAlpha = .55;
  ctx.fillStyle = T.cloud[1];
  for (const b of blobs) { circ(ctx, c.x + b[0] * c.s, c.y + b[1] * c.s + c.s * .12, b[2] * c.s); ctx.fill(); }
  ctx.fillStyle = T.cloud[0];
  for (const b of blobs) { circ(ctx, c.x + b[0] * c.s, c.y + b[1] * c.s, b[2] * c.s); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function drawSun() {
  if (T.orb === 'none') return; // sott'acqua niente sole
  const r = sun.r;
  const b = 1 + Math.sin(sun.bounce * Math.PI * 3) * 0.1 * sun.bounce;
  ctx.save(); ctx.translate(sun.x, sun.y); ctx.scale(b, b);
  if (T.orb === 'planet') { // pianeta con l'anello e la faccina
    ctx.fillStyle = 'rgba(255,200,230,.25)'; circ(ctx, 0, 0, r * 1.8); ctx.fill();
    ctx.strokeStyle = '#c9b6ff'; ctx.lineWidth = r * .16;
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.7, r * .45, -.3, Math.PI, Math.PI * 2); ctx.stroke(); // anello dietro
    const pg = ctx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r * 1.05);
    pg.addColorStop(0, '#ffe0ec'); pg.addColorStop(1, '#ffb0cc');
    ctx.fillStyle = pg; circ(ctx, 0, 0, r * 1.05); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; ell(ctx, 0, -r * .4, r * .9, r * .12); ctx.fill(); ell(ctx, 0, r * .45, r * .85, r * .1); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, r * 1.7, r * .45, -.3, 0, Math.PI); ctx.stroke(); // anello davanti
    ctx.strokeStyle = '#7a5a6a'; ctx.fillStyle = '#7a5a6a'; ctx.lineWidth = r * .08; ctx.lineCap = 'round';
    if (sun.laugh > 0) {
      for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * r * .32, -r * .12, r * .13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      ctx.fillStyle = '#c4566a'; ctx.beginPath(); ctx.arc(0, r * .15, r * .28, 0, Math.PI); ctx.closePath(); ctx.fill();
    } else {
      ell(ctx, -r * .32, -r * .12, r * .08, r * .11); ctx.fill(); ell(ctx, r * .32, -r * .12, r * .08, r * .11); ctx.fill();
      ctx.beginPath(); ctx.arc(0, r * .1, r * .26, Math.PI * .15, Math.PI * .85); ctx.stroke();
    }
    ctx.restore();
    return;
  }
  const moon = T.orb === 'moon', sunset = T.orb === 'sunset';
  const glowC = moon ? '255,250,215' : sunset ? '255,190,140' : '255,236,150';
  const glow = ctx.createRadialGradient(0, 0, r * .8, 0, 0, r * 2.3);
  glow.addColorStop(0, `rgba(${glowC},.55)`); glow.addColorStop(1, `rgba(${glowC},0)`);
  ctx.fillStyle = glow; circ(ctx, 0, 0, r * 2.3); ctx.fill();
  if (!moon) { // raggi
    ctx.save(); ctx.rotate(sun.rot);
    ctx.fillStyle = sunset ? '#ffb070' : '#ffd65c';
    for (let i = 0; i < 14; i++) {
      ctx.rotate(Math.PI * 2 / 14);
      ctx.beginPath(); ctx.moveTo(-r * .18, -r * 1.02); ctx.lineTo(0, -r * 1.55); ctx.lineTo(r * .18, -r * 1.02); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  const face = ctx.createRadialGradient(-r * .3, -r * .3, r * .1, 0, 0, r * 1.05);
  if (moon) { face.addColorStop(0, '#fffdf0'); face.addColorStop(1, '#f3e8b0'); }
  else if (sunset) { face.addColorStop(0, '#ffe2b5'); face.addColorStop(1, '#ffb27a'); }
  else { face.addColorStop(0, '#fff3b8'); face.addColorStop(1, '#ffd96b'); }
  ctx.fillStyle = face; circ(ctx, 0, 0, r * 1.05); ctx.fill();
  if (moon) { // crateri
    ctx.fillStyle = 'rgba(210,195,140,.35)';
    circ(ctx, r * .45, -r * .5, r * .16); ctx.fill(); circ(ctx, -r * .55, -r * .55, r * .1); ctx.fill(); circ(ctx, r * .62, r * .45, r * .12); ctx.fill();
  }
  // guance
  ctx.fillStyle = 'rgba(255,140,150,.45)';
  circ(ctx, -r * .55, r * .2, r * .17); ctx.fill(); circ(ctx, r * .55, r * .2, r * .17); ctx.fill();
  // occhi
  ctx.strokeStyle = '#7a5a3a'; ctx.fillStyle = '#7a5a3a'; ctx.lineWidth = r * .08; ctx.lineCap = 'round';
  if (sun.laugh > 0) {
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * r * .32, -r * .12, r * .13, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    ctx.fillStyle = '#c4566a'; ctx.beginPath(); ctx.arc(0, r * .2, r * .32, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff9fb1'; ell(ctx, 0, r * .4, r * .15, r * .08); ctx.fill();
  } else if (moon) { // luna assonnata: occhi chiusi
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * r * .32, -r * .16, r * .13, Math.PI * .1, Math.PI * .9); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, r * .12, r * .25, Math.PI * .2, Math.PI * .8); ctx.stroke();
  } else {
    ell(ctx, -r * .32, -r * .12, r * .08, r * .11); ctx.fill(); ell(ctx, r * .32, -r * .12, r * .08, r * .11); ctx.fill();
    ctx.beginPath(); ctx.arc(0, r * .12, r * .3, Math.PI * .15, Math.PI * .85); ctx.stroke();
  }
  ctx.restore();
}

function drawFireflies() {
  for (const f of fireflies) {
    const a = .5 + .5 * Math.sin(time * 2 + f.ph);
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, R * .3);
    g.addColorStop(0, `rgba(240,255,150,${.8 * a})`); g.addColorStop(1, 'rgba(240,255,150,0)');
    ctx.fillStyle = g; circ(ctx, f.x, f.y, R * .3); ctx.fill();
  }
}
function drawFlakes() {
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (const f of flakes) { circ(ctx, f.x, f.y, f.s); ctx.fill(); }
}
function drawBubbles() {
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
  for (const q of bubbles) { circ(ctx, q.x, q.y, q.s); ctx.stroke(); }
  for (const q of leaves) { ctx.fillStyle = q.c; ell(ctx, q.x, q.y, R * .14, R * .07, q.rot); ctx.fill(); }
  ctx.restore();
}

function drawProgress() {
  // una fila di stelline in alto a sinistra: si riempiono a ogni colpo
  const n = HITS_PER_LEVEL;
  const gap = Math.min(R * .45, (W - 200) / n);
  const sr = gap * .42;
  const x0 = 16 + sr, y0 = 16 + sr + 10;
  for (let i = 0; i < n; i++) {
    const full = i < levelHits || (transition && !transition.switched);
    let k = 1;
    if (i === fillPop && fillT < .4) k = 1 + .6 * Math.sin(fillT / .4 * Math.PI);
    ctx.fillStyle = full ? '#ffd65c' : 'rgba(255,255,255,.55)';
    ctx.strokeStyle = full ? '#fff' : 'rgba(255,255,255,.8)'; ctx.lineWidth = sr * .25; ctx.lineJoin = 'round';
    starPath(ctx, x0 + i * gap, y0, sr * k, 0); ctx.stroke(); ctx.fill();
  }
}

function drawRainbow() {
  if (!rainbow) return;
  const t = rainbow.t;
  const grow = Math.min(1, t / 1.2);
  const alpha = t > 6.5 ? Math.max(0, (8 - t) / 1.5) : 1;
  const cx = W / 2, cy = HORIZON + H * .12, band = R * .32;
  const r0 = Math.min(W * .55, (cy - H * .06));
  ctx.save(); ctx.globalAlpha = .8 * alpha; ctx.lineWidth = band + 1; ctx.lineCap = 'round';
  RAINBOW.forEach((c, i) => {
    ctx.strokeStyle = c; ctx.beginPath();
    ctx.arc(cx, cy, r0 - i * band, Math.PI, Math.PI + Math.PI * grow); ctx.stroke();
  });
  ctx.restore();
}

function drawMagic() {
  if (!magic) return;
  const m = magic, pulse = 1 + Math.sin(time * 8) * .08;
  ctx.save(); ctx.translate(m.x, m.y);
  const g = ctx.createRadialGradient(0, 0, m.s * .3, 0, 0, m.s * 2);
  g.addColorStop(0, 'rgba(255,255,220,.8)'); g.addColorStop(1, 'rgba(255,255,220,0)');
  ctx.fillStyle = g; circ(ctx, 0, 0, m.s * 2); ctx.fill();
  if (T.ground === 'sea') { // sott'acqua: medusa arcobaleno
    RAINBOW.forEach((c, i) => {
      const x = (-.5 + i / 6) * m.s;
      ctx.strokeStyle = c; ctx.lineWidth = m.s * .1; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.quadraticCurveTo(x + Math.sin(time * 4 + i) * m.s * .25, m.s * .6, x + Math.sin(time * 4 + i + 1) * m.s * .3, m.s * 1.2); ctx.stroke();
    });
    RAINBOW.slice().reverse().forEach((c, i) => {
      ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(0, 0, m.s * pulse * (1 - i * .1), m.s * .85 * pulse * (1 - i * .1), 0, Math.PI, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#6a4a6a';
    ell(ctx, -m.s * .2, -m.s * .3, m.s * .07, m.s * .1); ctx.fill(); ell(ctx, m.s * .2, -m.s * .3, m.s * .07, m.s * .1); ctx.fill();
    ctx.strokeStyle = '#6a4a6a'; ctx.lineWidth = m.s * .06;
    ctx.beginPath(); ctx.arc(0, -m.s * .2, m.s * .14, Math.PI * .15, Math.PI * .85); ctx.stroke();
    ctx.restore();
    return;
  }
  ctx.rotate(m.rot);
  RAINBOW.slice().reverse().forEach((c, i) => { // stella a strati arcobaleno
    ctx.fillStyle = c; starPath(ctx, 0, 0, m.s * pulse * (1 - i * .1), 0); ctx.fill();
  });
  ctx.fillStyle = '#fffbe0'; starPath(ctx, 0, 0, m.s * .3 * pulse, 0); ctx.fill();
  ctx.rotate(-m.rot); // faccina dritta
  ctx.fillStyle = '#6a4a6a';
  ell(ctx, -m.s * .17, -m.s * .05, m.s * .06, m.s * .09); ctx.fill();
  ell(ctx, m.s * .17, -m.s * .05, m.s * .06, m.s * .09); ctx.fill();
  ctx.strokeStyle = '#6a4a6a'; ctx.lineWidth = m.s * .06; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, m.s * .06, m.s * .13, Math.PI * .15, Math.PI * .85); ctx.stroke();
  ctx.restore();
}

function drawFade() {
  if (!transition || transition.t < 3.0) return;
  const t = transition.t;
  const a = t < 3.8 ? (t - 3.0) / .8 : 1 - (t - 3.8) / .8;
  ctx.fillStyle = `rgba(255,255,255,${clamp(a, 0, 1)})`; ctx.fillRect(0, 0, W, H);
}

function drawSkyStars() {
  for (const s of stars) {
    const k = Math.min(1, s.t * 3);
    const tw = 0.75 + 0.25 * Math.sin(time * 3 + s.ph);
    ctx.save();
    ctx.globalAlpha = tw;
    ctx.fillStyle = s.c; ctx.strokeStyle = '#fff'; ctx.lineWidth = s.s * .25; ctx.lineJoin = 'round';
    starPath(ctx, s.x, s.y, s.s * easeOutBack(k), Math.sin(time + s.ph) * .2);
    ctx.stroke(); ctx.fill();
    ctx.restore();
  }
}

function drawPupo(p) {
  const r = p.r, c = p.color;
  ctx.save();
  if (p.state === 'appear') { // cresce dai piedi
    const k = easeOutBack(p.sc);
    ctx.translate(p.x, p.slot.y); ctx.scale(k, k); ctx.translate(-p.x, -p.slot.y);
  }
  let bob = 0, sy = 1;
  if (p.state === 'idle') { bob = Math.sin(time * 3 + p.ph) * r * .04; sy = 1 + Math.sin(time * 3 + p.ph) * .02; }
  ctx.translate(p.x, p.y + bob);
  ctx.rotate(p.rot);
  ctx.scale(1 + p.squash * .35, (1 - p.squash * .3) * sy);

  const excited = p.state === 'up' || p.state === 'flying' || p.state === 'leave';
  // braccia (dietro al corpo)
  const lift = excited ? 1.0 + Math.sin(time * 12 + p.ph) * .35 : p.state === 'targeted' ? .6 : -.6 + Math.sin(time * 2 + p.ph) * .05;
  ctx.fillStyle = c.body; ctx.strokeStyle = c.dark; ctx.lineWidth = r * .05;
  const sh = SHAPES[p.shape] || SHAPES.tondo;
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * r * sh.arm, r * sh.armY); ctx.rotate(-side * lift);
    ell(ctx, side * r * .3, 0, r * .34, r * .17); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  // piedini
  ctx.fillStyle = c.dark;
  const fx = sh.feetX || .4;
  ell(ctx, -r * fx, r * .95, r * .3, r * .16); ctx.fill();
  ell(ctx, r * fx, r * .95, r * .3, r * .16); ctx.fill();
  // antenna
  ctx.save();
  ctx.translate(0, r * (sh.top + .03)); ctx.rotate(Math.sin(time * 4 + p.ph) * .14);
  ctx.strokeStyle = c.dark; ctx.fillStyle = c.dark; ctx.lineWidth = r * .12; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (p.ant) {
    case 'loop': ctx.moveTo(0, 0); ctx.lineTo(0, -r * .45); ctx.stroke(); circ(ctx, 0, -r * .7, r * .25); ctx.stroke(); break;
    case 'tri': ctx.moveTo(0, 0); ctx.lineTo(0, -r * .4); ctx.lineTo(-r * .28, -r * .85); ctx.lineTo(r * .28, -r * .85); ctx.lineTo(0, -r * .4); ctx.stroke(); break;
    case 'stick': ctx.moveTo(0, 0); ctx.lineTo(0, -r * .6); ctx.stroke(); circ(ctx, 0, -r * .7, r * .15); ctx.fill(); break;
    default: ctx.moveTo(0, 0); ctx.bezierCurveTo(-r * .35, -r * .4, r * .45, -r * .6, r * .05, -r * .9); ctx.stroke(); circ(ctx, r * .05, -r * .9, r * .09); ctx.fill();
  }
  ctx.restore();
  // corpo
  ctx.fillStyle = c.body; ctx.strokeStyle = c.dark; ctx.lineWidth = r * .06; ctx.lineJoin = 'round';
  sh.path(ctx, r); ctx.fill(); ctx.stroke();
  ctx.save(); sh.path(ctx, r); ctx.clip(); // pancino e riflesso restano dentro la sagoma
  ctx.fillStyle = 'rgba(255,255,255,.4)'; ell(ctx, 0, r * .5, r * .5, r * .36); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ell(ctx, -r * sh.cx * .65, r * (sh.top + .45), r * .26, r * .15, -.6); ctx.fill();
  ctx.restore();
  ctx.translate(0, r * sh.fy); // la faccina si sposta dove c'è spazio (es. triangolo più in basso)
  // guance
  ctx.fillStyle = 'rgba(255,120,150,.45)';
  circ(ctx, -r * sh.cx, r * .08, r * .14); ctx.fill(); circ(ctx, r * sh.cx, r * .08, r * .14); ctx.fill();
  // faccia
  ctx.fillStyle = '#4a3a55'; ctx.strokeStyle = '#4a3a55'; ctx.lineWidth = r * .09; ctx.lineCap = 'round';
  if (p.state === 'flying') { // occhi felici ^ ^ e bocca aperta
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * r * .32, -r * .1, r * .14, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    ctx.fillStyle = '#c4566a'; ctx.beginPath(); ctx.arc(0, r * .12, r * .28, 0, Math.PI); ctx.closePath(); ctx.fill();
  } else if (p.state === 'targeted') { // sorpreso
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#fff'; circ(ctx, sx * r * .32, -r * .15, r * .19); ctx.fill();
      ctx.fillStyle = '#4a3a55'; circ(ctx, sx * r * .32, -r * .15, r * .11); ctx.fill();
    }
    ell(ctx, 0, r * .28, r * .12, r * .15); ctx.fill();
  } else {
    const bl = p.blinkT > 0 ? .12 : 1;
    for (const sx of [-1, 1]) {
      ctx.fillStyle = '#4a3a55'; ell(ctx, sx * r * .32, -r * .15, r * .12, r * .16 * bl); ctx.fill();
      if (bl === 1) { ctx.fillStyle = '#fff'; circ(ctx, sx * r * .32 + r * .04, -r * .21, r * .045); ctx.fill(); }
    }
    ctx.beginPath();
    if (excited) ctx.arc(0, r * .05, r * .3, Math.PI * .1, Math.PI * .9);
    else ctx.arc(0, r * .05, r * .24, Math.PI * .18, Math.PI * .82);
    ctx.stroke();
  }
  if (p.acc) drawAccessory(p, sh, r);
  ctx.restore();
}

// disegnato nelle coordinate della faccina (già spostate di sh.fy)
function drawAccessory(p, sh, r) {
  const col = p.accC;
  const top = (sh.top - sh.fy) * r;            // cima della sagoma
  const spot = HAT_SPOT[p.shape] || [.5, .2];
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  switch (p.acc) {
    case 'occhiali': {
      ctx.strokeStyle = col; ctx.lineWidth = r * .07;
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      for (const sx of [-1, 1]) { circ(ctx, sx * r * .32, -r * .15, r * .21); ctx.fill(); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(-r * .11, -r * .18); ctx.quadraticCurveTo(0, -r * .26, r * .11, -r * .18); ctx.stroke();
      break;
    }
    case 'fiocco': {
      ctx.translate(spot[0] * r, top + spot[1] * r); ctx.rotate(.35); ctx.scale(1.45, 1.45);
      ctx.fillStyle = col; ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.lineWidth = r * .03;
      for (const sx of [-1, 1]) { // due ali a goccia
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(sx * r * .3, -r * .28, sx * r * .36, 0);
        ctx.quadraticCurveTo(sx * r * .3, r * .28, 0, 0);
        ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#fff'; circ(ctx, 0, 0, r * .08); ctx.fill();
      ctx.fillStyle = col; circ(ctx, 0, 0, r * .06); ctx.fill();
      break;
    }
    case 'corona': {
      ctx.translate(-spot[0] * r, top + spot[1] * r); ctx.rotate(-.35); ctx.scale(1.25, 1.25);
      ctx.fillStyle = '#ffd34d'; ctx.strokeStyle = '#e8b52e'; ctx.lineWidth = r * .03;
      ctx.beginPath();
      ctx.moveTo(-r * .32, r * .02); ctx.lineTo(-r * .34, -r * .3); ctx.lineTo(-r * .16, -r * .14);
      ctx.lineTo(0, -r * .38); ctx.lineTo(r * .16, -r * .14); ctx.lineTo(r * .34, -r * .3); ctx.lineTo(r * .32, r * .02);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = col;
      for (const q of [[-.34, -.3], [0, -.38], [.34, -.3]]) { circ(ctx, q[0] * r, q[1] * r, r * .06); ctx.fill(); }
      ctx.fillStyle = '#fff'; circ(ctx, 0, -r * .08, r * .05); ctx.fill();
      break;
    }
    case 'cilindro': {
      ctx.translate(-spot[0] * r, top + spot[1] * r); ctx.rotate(-.3); ctx.scale(1.45, 1.45);
      ctx.fillStyle = col; rr(ctx, -r * .2, -r * .5, r * .4, r * .5, r * .05); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(-r * .2, -r * .15, r * .4, r * .08);
      ctx.fillStyle = col; ell(ctx, 0, 0, r * .36, r * .07); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-r * .14, -r * .45, r * .06, r * .26);
      break;
    }
    case 'berretto': { // berretto di lana con pompon
      ctx.translate(-spot[0] * r, top + spot[1] * r); ctx.rotate(-.35); ctx.scale(1.4, 1.4);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(0, 0, r * .32, r * .32, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = r * .04;
      for (const x of [-.15, 0, .15]) { ctx.beginPath(); ctx.moveTo(x * r, -r * .04); ctx.lineTo(x * r * .8, -r * .26); ctx.stroke(); }
      ctx.fillStyle = '#fff'; rr(ctx, -r * .35, -r * .06, r * .7, r * .13, r * .06); ctx.fill();
      circ(ctx, 0, -r * .36, r * .1); ctx.fill();
      break;
    }
    case 'paglia': { // cappello da sole con nastro
      ctx.translate(-spot[0] * r, top + spot[1] * r); ctx.rotate(-.3); ctx.scale(1.4, 1.4);
      ctx.fillStyle = '#f5d68f'; ell(ctx, 0, 0, r * .48, r * .1); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 0, r * .25, r * .24, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = col; ctx.fillRect(-r * .25, -r * .09, r * .5, r * .07);
      ctx.strokeStyle = 'rgba(190,150,70,.45)'; ctx.lineWidth = r * .025;
      ctx.beginPath(); ctx.ellipse(0, 0, r * .4, r * .07, 0, 0, Math.PI); ctx.stroke();
      break;
    }
    case 'cappello': { // cappellino da festa inclinato
      ctx.translate(-spot[0] * r, top + spot[1] * r); ctx.rotate(-.45); ctx.scale(1.2, 1.2);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(-r * .27, 0); ctx.lineTo(0, -r * .7); ctx.lineTo(r * .27, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.7)';
      for (const d of [[-.08, -.18], [.1, -.32], [-.03, -.48]]) { circ(ctx, d[0] * r, d[1] * r, r * .05); ctx.fill(); }
      ctx.fillStyle = '#fff'; ell(ctx, 0, 0, r * .3, r * .07); ctx.fill();   // bordo
      circ(ctx, 0, -r * .72, r * .1); ctx.fill();                          // pompon
      break;
    }
    case 'papillon': {
      ctx.translate(0, r * .55);
      ctx.fillStyle = col;
      for (const sx of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(sx * r * .28, -r * .15); ctx.lineTo(sx * r * .28, r * .15); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.6)'; circ(ctx, 0, 0, r * .07); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

// cespugli "a palle morbide" con colori diversi per ogni mondo: [scuro, medio, chiaro, decorazioni]
const BLOB_PAL = {
  bush:       ['#6cc07a', '#86d68f', '#a8e6aa', '#ff9fba'],
  coral:      ['#f28fa5', '#ffa7b9', '#ffc6d2', '#ffffff'],
  alga:       ['#3fa38a', '#5cc4a4', '#86dcc0', null],
  nuvola:     ['#b9d6f5', '#d2e6fb', '#eef6ff', null],
  nuvolarosa: ['#f5bfd4', '#ffd6e6', '#fff0f6', null],
  felce:      ['#4fa86a', '#66bd7c', '#8fd49a', null],
  tropicale:  ['#4fa86a', '#6fc485', '#94d8a2', 'flower'],
};
function drawBlobs(r, pal, type) {
  const blobs = [[-1.05, -.75, .8], [1.05, -.75, .8], [-.55, -1.5, .82], [.55, -1.55, .82], [0, -.85, 1.0], [0, -1.75, .65]];
  ctx.fillStyle = pal[0];
  for (const b of blobs) { circ(ctx, b[0] * r, b[1] * r + r * .08, b[2] * r); ctx.fill(); }
  ctx.fillStyle = pal[1];
  for (const b of blobs) { circ(ctx, b[0] * r, b[1] * r, b[2] * r); ctx.fill(); }
  ctx.fillStyle = pal[2];
  for (const b of blobs) { circ(ctx, (b[0] - .22) * r, (b[1] - .25) * r, b[2] * r * .33); ctx.fill(); }
  if (type === 'felce') { // venature delle foglie
    ctx.strokeStyle = pal[0]; ctx.lineWidth = r * .06; ctx.lineCap = 'round';
    for (const q of [[-1.0, -.7], [1.0, -.7], [-.5, -1.5], [.5, -1.55], [0, -1.0]]) { ctx.beginPath(); ctx.moveTo(q[0] * r, (q[1] + .4) * r); ctx.lineTo(q[0] * r, (q[1] - .4) * r); ctx.stroke(); }
  }
  if (type === 'alga') { // bollicine
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
    for (const q of [[-.6, -2.4, .1], [.3, -2.7, .07], [.8, -2.3, .08]]) { circ(ctx, q[0] * r, q[1] * r, q[2] * r); ctx.stroke(); }
  }
  if (pal[3] === 'flower') { // fiori tropicali
    for (const q of [[-.9, -1.0, '#ff7fa6'], [.4, -.7, '#ffa25a'], [.7, -1.7, '#ffd34d'], [-.3, -1.9, '#c58bff']]) {
      ctx.fillStyle = q[2];
      for (let k = 0; k < 5; k++) { const a = k * Math.PI * .4; ell(ctx, q[0] * r + Math.cos(a) * r * .14, q[1] * r + Math.sin(a) * r * .14, r * .13, r * .08, a); ctx.fill(); }
      ctx.fillStyle = '#fff3a0'; circ(ctx, q[0] * r, q[1] * r, r * .06); ctx.fill();
    }
  } else if (pal[3]) {
    ctx.fillStyle = pal[3];
    for (const q of [[-.9, -1.0], [.3, -.6], [.8, -1.6], [-.3, -1.9], [1.3, -.5]]) { circ(ctx, q[0] * r, q[1] * r, r * .1); ctx.fill(); }
  }
}

function drawHide(s) {
  const r = slotR(s);
  ctx.save();
  ctx.translate(s.x, s.y + r * .2);
  ctx.rotate(Math.sin(time * 30) * s.wob * .07);
  ctx.translate(0, -r * .2);
  // ombra
  ctx.fillStyle = 'rgba(40,100,40,.15)'; ell(ctx, 0, r * .22, r * 1.8, r * .25); ctx.fill();

  switch (s.hide) {
    case 'rock': {
      const shape = () => {
        ctx.beginPath(); ctx.moveTo(-r * 1.6, r * .22);
        ctx.bezierCurveTo(-r * 1.85, -r * 1.2, -r * .95, -r * 2.5, 0, -r * 2.38);
        ctx.bezierCurveTo(r * 1.05, -r * 2.5, r * 1.85, -r * 1.3, r * 1.6, r * .22);
        ctx.closePath();
      };
      const g = ctx.createLinearGradient(0, -r * 2.4, 0, r * .2);
      const rp = T.rock || ['#d9d3ec', '#b4acce', 'rgba(150,140,190,.45)']; // colori del sasso per mondo
      g.addColorStop(0, rp[0]); g.addColorStop(1, rp[1]);
      ctx.fillStyle = g; shape(); ctx.fill();
      ctx.fillStyle = rp[2];
      circ(ctx, r * .6, -r * .7, r * .2); ctx.fill(); circ(ctx, -r * .7, -r * .35, r * .14); ctx.fill(); circ(ctx, r * .1, -r * 1.5, r * .12); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ell(ctx, -r * .6, -r * 1.75, r * .45, r * .18, -.5); ctx.fill();
      ctx.fillStyle = '#9fdc97'; ell(ctx, r * .7, -r * 2.05, r * .35, r * .12, .3); ctx.fill(); // un po' di muschio
      break;
    }
    case 'bush': case 'coral': case 'alga': case 'nuvola': case 'nuvolarosa': case 'felce': case 'tropicale':
      drawBlobs(r, BLOB_PAL[s.hide], s.hide);
      break;
    case 'shell': { // conchiglia a ventaglio
      ctx.fillStyle = '#ffc2cf'; ctx.beginPath(); ctx.ellipse(0, r * .15, r * 1.75, r * 2.45, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd9e1';
      for (let i = 0; i <= 8; i++) { const a = Math.PI + i * Math.PI / 8; circ(ctx, Math.cos(a) * r * 1.68, r * .15 + Math.sin(a) * r * 2.35, r * .2); ctx.fill(); }
      ctx.strokeStyle = 'rgba(220,110,140,.45)'; ctx.lineWidth = r * .07; ctx.lineCap = 'round';
      for (let i = 1; i < 8; i++) { const a = Math.PI + i * Math.PI / 8; ctx.beginPath(); ctx.moveTo(0, r * .1); ctx.lineTo(Math.cos(a) * r * 1.5, r * .15 + Math.sin(a) * r * 2.1); ctx.stroke(); }
      ctx.fillStyle = '#f5a8ba'; ctx.beginPath(); ctx.moveTo(-r * .45, r * .2); ctx.lineTo(r * .45, r * .2); ctx.lineTo(0, -r * .25); ctx.closePath(); ctx.fill();
      break;
    }
    case 'chest': { // scrigno del tesoro
      ctx.fillStyle = '#c99a6b'; rr(ctx, -r * 1.5, -r * 1.55, r * 3.0, r * 1.75, r * .2); ctx.fill();
      ctx.fillStyle = '#b5845a'; ctx.beginPath(); ctx.ellipse(0, -r * 1.55, r * 1.55, r * .8, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd34d';
      ctx.fillRect(-r * 1.1, -r * 2.3, r * .22, r * 2.5); ctx.fillRect(r * .88, -r * 2.3, r * .22, r * 2.5);
      ctx.fillRect(-r * 1.5, -r * 1.62, r * 3.0, r * .16);
      rr(ctx, -r * .25, -r * 1.5, r * .5, r * .6, r * .1); ctx.fill();
      ctx.fillStyle = '#a97c52'; circ(ctx, 0, -r * 1.2, r * .08); ctx.fill();
      ctx.fillStyle = '#fff6b0'; starPath(ctx, -r * .55, -r * .6, r * .15, 0); ctx.fill(); starPath(ctx, r * .6, -r * .9, r * .12, 0); ctx.fill();
      break;
    }
    case 'casetta': { // casetta sulla nuvola
      ctx.fillStyle = '#fff1b8'; rr(ctx, -r * 1.4, -r * 1.6, r * 2.8, r * 1.8, r * .2); ctx.fill();
      ctx.fillStyle = '#ffadc2'; ctx.beginPath(); ctx.moveTo(-r * 1.75, -r * 1.45); ctx.lineTo(0, -r * 2.55); ctx.lineTo(r * 1.75, -r * 1.45); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c9a7f5'; rr(ctx, -r * .4, -r * .9, r * .8, r * 1.1, r * .4); ctx.fill();
      ctx.fillStyle = '#9fd3ff'; rr(ctx, r * .65, -r * 1.25, r * .5, r * .45, r * .1); ctx.fill(); rr(ctx, -r * 1.15, -r * 1.25, r * .5, r * .45, r * .1); ctx.fill();
      ctx.fillStyle = '#ffd34d'; circ(ctx, r * .22, -r * .35, r * .06); ctx.fill();
      break;
    }
    case 'mongolfiera': { // mongolfiera appoggiata
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, -r * 1.2, r * 1.35, r * 1.3, 0, 0, Math.PI * 2); ctx.clip();
      RAINBOW.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(-r * 1.35 + i * r * 2.7 / 7, -r * 2.6, r * 2.7 / 7 + 1, r * 2.8); });
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ell(ctx, -r * .5, -r * 1.8, r * .3, r * .18, -.6); ctx.fill();
      ctx.fillStyle = '#c99a6b'; rr(ctx, -r * 1.05, -r * .35, r * 2.1, r * .6, r * .12); ctx.fill();
      ctx.strokeStyle = '#a97c52'; ctx.lineWidth = r * .05; ctx.beginPath(); ctx.moveTo(-r * 1.05, -r * .15); ctx.lineTo(r * 1.05, -r * .15); ctx.stroke();
      break;
    }
    case 'castello': { // castello di sabbia
      const sand = '#f3d79a', dark = '#e2bf78';
      ctx.fillStyle = sand; rr(ctx, -r * 1.65, -r * 1.35, r * 3.3, r * 1.55, r * .15); ctx.fill();
      for (const [x, w, top] of [[-1.65, .9, -2.1], [.75, .9, -2.1], [-.5, 1.0, -2.45]]) {
        ctx.fillStyle = sand; ctx.fillRect(x * r, top * r, w * r, (-1.3 - top) * r);
        for (let i = 0; i < 3; i++) ctx.fillRect((x + i * w / 2.5) * r, (top - .18) * r, w * r / 5, r * .2);
      }
      ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(0, r * .2, r * .38, r * .7, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = dark; circ(ctx, -r * 1.2, -r * 1.75, r * .1); ctx.fill(); circ(ctx, r * 1.2, -r * 1.75, r * .1); ctx.fill();
      ctx.strokeStyle = '#a97c52'; ctx.lineWidth = r * .04; ctx.beginPath(); ctx.moveTo(0, -r * 2.62); ctx.lineTo(0, -r * 3.0); ctx.stroke();
      ctx.fillStyle = '#ff7fa6'; ctx.beginPath(); ctx.moveTo(0, -r * 3.0); ctx.lineTo(r * .35, -r * 2.9); ctx.lineTo(0, -r * 2.78); ctx.fill();
      break;
    }
    case 'secchiello': { // secchiello da spiaggia
      ctx.strokeStyle = '#5fb0ef'; ctx.lineWidth = r * .1; ctx.beginPath(); ctx.arc(0, -r * 2.1, r * 1.3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.fillStyle = '#7fc8ff'; ctx.beginPath(); ctx.moveTo(-r * 1.6, -r * 2.15); ctx.lineTo(r * 1.6, -r * 2.15); ctx.lineTo(r * 1.2, r * .2); ctx.lineTo(-r * 1.2, r * .2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#5fb0ef'; rr(ctx, -r * 1.7, -r * 2.35, r * 3.4, r * .32, r * .14); ctx.fill();
      ctx.fillStyle = '#ffe28a'; starPath(ctx, 0, -r * 1.0, r * .45, 0); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-r * 1.1, -r * 1.9, r * .2, r * 1.6);
      break;
    }
    case 'fieno': { // balla di fieno
      ctx.fillStyle = '#f2d27a'; rr(ctx, -r * 1.7, -r * 2.3, r * 3.4, r * 2.5, r * .5); ctx.fill();
      ctx.strokeStyle = '#d9b55a'; ctx.lineWidth = r * .06; ctx.lineCap = 'round';
      for (let i = 0; i < 5; i++) { const y = -r * (2.0 - i * .45); ctx.beginPath(); ctx.moveTo(-r * 1.4, y); ctx.quadraticCurveTo(0, y + r * .12, r * 1.4, y); ctx.stroke(); }
      ctx.strokeStyle = '#c99a4a'; ctx.lineWidth = r * .1; ctx.beginPath(); ctx.moveTo(-r * .6, -r * 2.3); ctx.lineTo(-r * .6, r * .2); ctx.moveTo(r * .6, -r * 2.3); ctx.lineTo(r * .6, r * .2); ctx.stroke();
      break;
    }
    case 'fienile': { // piccolo fienile rosso
      ctx.fillStyle = '#ff8f8f'; rr(ctx, -r * 1.5, -r * 1.6, r * 3.0, r * 1.8, r * .1); ctx.fill();
      ctx.fillStyle = '#e66f7a'; ctx.beginPath(); ctx.moveTo(-r * 1.75, -r * 1.5); ctx.lineTo(-r * 1.0, -r * 2.45); ctx.lineTo(r * 1.0, -r * 2.45); ctx.lineTo(r * 1.75, -r * 1.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(-r * .6, -r * 1.05, r * 1.2, r * 1.25);
      ctx.strokeStyle = '#ff8f8f'; ctx.lineWidth = r * .1; ctx.beginPath(); ctx.moveTo(-r * .55, -r * 1.0); ctx.lineTo(r * .55, r * .15); ctx.moveTo(r * .55, -r * 1.0); ctx.lineTo(-r * .55, r * .15); ctx.stroke();
      ctx.fillStyle = '#f2d27a'; circ(ctx, 0, -r * 1.85, r * .25); ctx.fill();
      break;
    }
    case 'zucca': { // zuccone
      ctx.fillStyle = '#6cc07a'; rr(ctx, -r * .12, -r * 2.55, r * .24, r * .45, r * .1); ctx.fill();
      for (const [x, rx, c2] of [[-.75, .85, '#ffa25a'], [.75, .85, '#ffa25a'], [0, .95, '#ffb26b']]) { ctx.fillStyle = c2; ell(ctx, x * r, -r * 1.1, rx * r, r * 1.2); ctx.fill(); }
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ell(ctx, -r * .3, -r * 1.7, r * .2, r * .35, -.3); ctx.fill();
      ctx.fillStyle = '#7fcf86'; ell(ctx, r * .4, -r * 2.25, r * .35, r * .14, .4); ctx.fill();
      break;
    }
    case 'fungo': { // fungo gigante a pois
      ctx.fillStyle = '#fff3dc'; rr(ctx, -r * 1.15, -r * 1.4, r * 2.3, r * 1.6, r * .5); ctx.fill();
      ctx.fillStyle = '#ff8f9f'; ctx.beginPath(); ctx.ellipse(0, -r * 1.25, r * 1.85, r * 1.2, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffd9e1'; ell(ctx, 0, -r * 1.25, r * 1.85, r * .2); ctx.fill();
      ctx.fillStyle = '#fff';
      for (const q of [[-1.0, -1.65, .22], [.1, -2.1, .25], [.95, -1.6, .2], [-.4, -1.5, .14], [.55, -2.0, .12]]) { circ(ctx, q[0] * r, q[1] * r, q[2] * r); ctx.fill(); }
      ctx.fillStyle = '#e8d8bf'; rr(ctx, -r * .3, -r * .6, r * .6, r * .8, r * .3); ctx.fill();
      break;
    }
    case 'ceppo': { // ceppo d'albero
      ctx.fillStyle = '#c49a72'; rr(ctx, -r * 1.6, -r * 2.05, r * 3.2, r * 2.25, r * .3); ctx.fill();
      ctx.strokeStyle = 'rgba(120,80,50,.3)'; ctx.lineWidth = r * .07;
      for (const x of [-1.0, -.3, .5, 1.1]) { ctx.beginPath(); ctx.moveTo(x * r, -r * 1.8); ctx.lineTo(x * r + r * .05, r * .1); ctx.stroke(); }
      ctx.fillStyle = '#e8c79c'; ell(ctx, 0, -r * 2.05, r * 1.6, r * .35); ctx.fill();
      ctx.strokeStyle = '#c9a072'; ctx.lineWidth = r * .05;
      for (const k2 of [.35, .75, 1.15]) { ctx.beginPath(); ctx.ellipse(0, -r * 2.05, r * k2, r * k2 * .22, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = '#ff8f9f'; ctx.beginPath(); ctx.ellipse(r * 1.45, -r * .7, r * .3, r * .22, 0, Math.PI, Math.PI * 2); ctx.fill();
      break;
    }
    case 'razzo': { // razzo parcheggiato
      ctx.fillStyle = '#ff7fa6';
      ctx.beginPath(); ctx.moveTo(-r * .9, -r * .9); ctx.lineTo(-r * 1.6, r * .2); ctx.lineTo(-r * .8, r * .2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(r * .9, -r * .9); ctx.lineTo(r * 1.6, r * .2); ctx.lineTo(r * .8, r * .2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f4f1ff'; rr(ctx, -r * 1.0, -r * 1.75, r * 2.0, r * 1.95, r * .45); ctx.fill();
      ctx.fillStyle = '#ff7fa6'; ctx.beginPath(); ctx.moveTo(-r * .95, -r * 1.6); ctx.quadraticCurveTo(0, -r * 3.0, r * .95, -r * 1.6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b8b0dc'; circ(ctx, 0, -r * 1.0, r * .45); ctx.fill();
      ctx.fillStyle = '#9fd3ff'; circ(ctx, 0, -r * 1.0, r * .34); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; circ(ctx, -r * .1, -r * 1.1, r * .1); ctx.fill();

    }
    case 'ufo': {
      ctx.fillStyle = '#c9b6ff'; ctx.beginPath(); ctx.ellipse(0, -r * .9, r * 1.15, r * 1.45, 0, Math.PI, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ell(ctx, -r * .4, -r * 1.7, r * .3, r * .15, -.5); ctx.fill();
      ctx.fillStyle = '#a9b6d6'; ell(ctx, 0, -r * .45, r * 1.85, r * .55); ctx.fill();
      ctx.fillStyle = '#8f9cc2'; ell(ctx, 0, -r * .2, r * 1.3, r * .3); ctx.fill();
      for (let i = 0; i < 6; i++) { ctx.fillStyle = (i + Math.floor(time * 3)) % 2 ? '#ffd34d' : '#ff8fb1'; circ(ctx, (-1.35 + i * .54) * r, -r * .45, r * .1); ctx.fill(); }

    }
    case 'pianetino': { // pianetino con l'anello appoggiato su un cratere
      ctx.fillStyle = '#b3a3e0'; ell(ctx, 0, r * .05, r * 1.5, r * .45); ctx.fill();
      ctx.strokeStyle = '#ffd38a'; ctx.lineWidth = r * .2;
      ctx.beginPath(); ctx.ellipse(0, -r * 1.25, r * 2.0, r * .45, -.25, Math.PI, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#9fe6bf'; circ(ctx, 0, -r * 1.25, r * 1.3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ell(ctx, 0, -r * 1.7, r * 1.1, r * .15); ctx.fill(); ell(ctx, 0, -r * .85, r * 1.15, r * .15); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, -r * 1.25, r * 2.0, r * .45, -.25, 0, Math.PI); ctx.stroke();
      break;
    }
    case 'uovo': { // uovo di dinosauro
      ctx.fillStyle = '#fff6e0'; ell(ctx, 0, -r * 1.1, r * 1.4, r * 1.45); ctx.fill();
      ctx.fillStyle = '#a8e0b0';
      for (const q of [[-.6, -1.6, .25], [.5, -1.9, .2], [.7, -.8, .28], [-.5, -.5, .22], [0, -1.2, .18]]) { circ(ctx, q[0] * r, q[1] * r, q[2] * r); ctx.fill(); }
      ctx.strokeStyle = '#e2cfa8'; ctx.lineWidth = r * .07; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(-r * 1.0, -r * 1.9); ctx.lineTo(-r * .6, -r * 1.6); ctx.lineTo(-r * .3, -r * 1.95); ctx.lineTo(0, -r * 1.65); ctx.stroke();

    }
    case 'vulcano': { // vulcanello simpatico
      ctx.fillStyle = '#c79a7f'; ctx.beginPath(); ctx.moveTo(-r * 1.85, r * .2); ctx.lineTo(-r * .6, -r * 2.2); ctx.lineTo(r * .6, -r * 2.2); ctx.lineTo(r * 1.85, r * .2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff9a6b'; ell(ctx, 0, -r * 2.2, r * .62, r * .16); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-r * .4, -r * 2.15); ctx.quadraticCurveTo(-r * .55, -r * 1.6, -r * .3, -r * 1.4); ctx.quadraticCurveTo(-r * .15, -r * 1.7, 0, -r * 2.15); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.moveTo(-r * .45, -r * 2.0); ctx.lineTo(-r * 1.3, r * .1); ctx.lineTo(-r * 1.0, r * .1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = INK; circ(ctx, -r * .35, -r * 1.0, r * .08); ctx.fill(); circ(ctx, r * .35, -r * 1.0, r * .08); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = r * .07; ctx.beginPath(); ctx.arc(0, -r * .8, r * .22, .2 * Math.PI, .8 * Math.PI); ctx.stroke();

    case 'sofa': {
      ctx.fillStyle = '#c98fa8';
      rr(ctx, -r * 1.5, 0, r * .28, r * .26, r * .06); ctx.fill();
      rr(ctx, r * 1.22, 0, r * .28, r * .26, r * .06); ctx.fill();
      ctx.fillStyle = '#ffb8cc'; rr(ctx, -r * 1.55, -r * 2.38, r * 3.1, r * 1.75, r * .45); ctx.fill();
      ctx.fillStyle = '#ff9fba';
      for (const bx of [-.75, 0, .75]) { circ(ctx, bx * r, -r * 1.55, r * .08); ctx.fill(); }
      ctx.fillStyle = '#ffa6bf'; rr(ctx, -r * 1.7, -r * .98, r * 3.4, r * 1.0, r * .3); ctx.fill();
      ctx.strokeStyle = 'rgba(200,100,130,.35)'; ctx.lineWidth = r * .05;
      ctx.beginPath(); ctx.moveTo(0, -r * .9); ctx.lineTo(0, -r * .1); ctx.stroke();
      ctx.fillStyle = '#ffb0c6';
      rr(ctx, -r * 1.98, -r * 1.6, r * .62, r * 1.62, r * .3); ctx.fill();
      rr(ctx, r * 1.36, -r * 1.6, r * .62, r * 1.62, r * .3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.4)'; rr(ctx, -r * 1.3, -r * 2.25, r * 1.2, r * .2, r * .1); ctx.fill();

    case 'igloo': {
      const by = r * .22, rx = r * 1.75, ry = r * 2.55;
      ctx.fillStyle = '#f5faff'; ctx.strokeStyle = '#c9dcef'; ctx.lineWidth = r * .07;
      ctx.beginPath(); ctx.ellipse(0, by, rx, ry, 0, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.lineWidth = r * .05;
      for (let k = 1; k <= 3; k++) { // file di mattoni di ghiaccio
        const y = by - k * r * .62;
        const w = rx * Math.sqrt(Math.max(0, 1 - Math.pow((by - y) / ry, 2)));
        ctx.beginPath(); ctx.moveTo(-w, y); ctx.lineTo(w, y); ctx.stroke();
        for (let j = -2; j <= 2; j++) {

      ctx.fillStyle = 'rgba(255,255,255,.7)'; ell(ctx, -r * .7, -r * 1.7, r * .4, r * .15, -.5); ctx.fill();

      ctx.fillStyle = '#ffe08a'; rr(ctx, -r * 1.45, -r * 2.0, r * 2.9, r * 2.2, r * .25); ctx.fill();
      ctx.fillStyle = '#fff3c4';
      for (const q of [[-1, -.5], [1, -.5], [-1.05, -1.5], [1.05, -1.5], [0, -.25]]) { circ(ctx, q[0] * r, q[1] * r, r * .11); ctx.fill(); }
      ctx.fillStyle = '#ffc66b'; rr(ctx, -r * 1.58, -r * 2.38, r * 3.16, r * .55, r * .22); ctx.fill();
      ctx.fillStyle = '#ff9fba'; ctx.strokeStyle = '#fff'; ctx.lineWidth = r * .08; ctx.lineJoin = 'round';
      starPath(ctx, 0, -r * 1.0, r * .48, 0); ctx.stroke(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.45)'; rr(ctx, -r * 1.35, -r * 2.28, r * 1.1, r * .14, r * .07); ctx.fill();

    ell(ctx, -r * .75, -r * 2.15, r * .45, r * .2); ctx.fill();
    ell(ctx, r * .8, -r * 2.12, r * .4, r * .18); ctx.fill();

function drawSlot(s) {
  const p = s.pupo && s.pupo.state !== 'flying' && s.pupo.state !== 'leave' ? s.pupo : null;
  if (s.hide) {
    if (p) { // il pupazzetto sta dietro: lo taglio a livello del terreno
      ctx.save(); ctx.beginPath(); ctx.rect(-10, -10, W + 20, s.y + 10); ctx.clip();
      drawPupo(p); ctx.restore();
    }
    drawHide(s);
  } else {
    const r = slotR(s);
    ctx.fillStyle = 'rgba(40,100,40,.15)'; ell(ctx, s.x, s.y + r * .05, r * .85, r * .2); ctx.fill();
    if (p) drawPupo(p);
  }
}

function drawSprout(f) {
  const k = easeOutBack(Math.min(1, f.t * 3));
  const a = f.t > 6 ? 7 - f.t : 1;
  const s = f.s, top = f.y - s * 2.2 * k;
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  if (f.kind && f.kind !== 'flower') { // stella marina, granchietto, funghetto, stellina
    ctx.translate(f.x, f.y); ctx.scale(k, k);
    const q = pen(ctx, s);
    if (f.kind === 'starfish') {
      ctx.fillStyle = f.c; starPath(ctx, 0, -s * .5, s * .9, Math.sin(f.t) * .1); ctx.fill();
      q.eye(-.18, -.6, .07); q.eye(.18, -.6, .07); q.smile(0, -.45, .12);
    } else if (f.kind === 'crab') {
      ctx.scale(1.4, 1.4); ANIMALS.granchio.draw(pen(ctx, s), f.t * 2);
    } else if (f.kind === 'mushroom') {
      q.b('#fff3dc', -.25, -.9, .5, .9, .15);
      ctx.fillStyle = f.c; ctx.beginPath(); ctx.ellipse(0, -.85 * s, .75 * s, .55 * s, 0, Math.PI, Math.PI * 2); ctx.fill();
      q.o('#fff', -.3, -1.1, .1); q.o('#fff', .25, -1.2, .08); q.eye(-.1, -.45, .05); q.eye(.1, -.45, .05);
    } else { // starlet
      ctx.fillStyle = '#ffe28a'; starPath(ctx, 0, -s * .7, s * .7, f.t); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,160,.35)'; circ(ctx, 0, -s * .7, s * 1.1); ctx.fill();
    }
    ctx.restore();
    return;
  }
  ctx.strokeStyle = '#5fb46a'; ctx.lineWidth = s * .25; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x, top); ctx.stroke();
  ctx.fillStyle = '#7fcf86'; ell(ctx, f.x + s * .45 * k, f.y - s * .9 * k, s * .45 * k, s * .2 * k, -.5); ctx.fill();
  ctx.fillStyle = f.c;
  for (let i = 0; i < 5; i++) { const an = i * Math.PI * .4 + f.t; circ(ctx, f.x + Math.cos(an) * s * .55 * k, top + Math.sin(an) * s * .55 * k, s * .45 * k); ctx.fill(); }
  ctx.fillStyle = '#ffd34d'; circ(ctx, f.x, top, s * .38 * k); ctx.fill();
  ctx.restore();
}

// guantone per ogni mondo: [chiaro, scuro, polsino, molla, decorazione] — scelti per contrastare con lo sfondo
const GLOVES = {
  prato:      ['#ffa0ad', '#ff6f86', '#fff1f5', '#b8b0dc', null],
  neve:       ['#ff8a8a', '#e85c6a', '#ffffff', '#c9b6ff', 'wool'],
  sottacqua:  ['#ffb27a', '#ff8a4f', '#fff3e6', '#ffd38a', 'bubbles'],
  nuvole:     ['#8f8cf5', '#5f5bd6', '#e9e7ff', '#ffadc2', 'heart'],
  fattoria:   ['#8fcdfa', '#4fa8e8', '#ffffff', '#ffb26b', 'check'],
  spiaggia:   ['#6fe0d6', '#2fbfb2', '#ffffff', '#ff8fb1', 'starfish'],
  bosco:      ['#ffe066', '#ffc21f', '#fff9dc', '#c9a7f5', null],
  spazio:     ['#ffffff', '#d9dcef', '#9fd3ff', '#ffd34d', 'star'],
  giurassico: ['#c08af5', '#9a5be6', '#f3e8ff', '#ffb26b', 'spikes'],
  giungla:    ['#ffb35a', '#ff8f2e', '#fff3dc', '#c9a7f5', 'spots'],
};
function lighten(hex, k) { // schiarisce un colore (di notte il guantone si vede meglio)
  const n = parseInt(hex.slice(1), 16), m = c => Math.round(c + (255 - c) * k);
  return `rgb(${m(n >> 16)},${m((n >> 8) & 255)},${m(n & 255)})`;
}

function drawGlove(g) {
  const gx = gloveX(g), gy = g.y, s = g.s, dir = g.dir;
  const G0 = GLOVES[T.key] || GLOVES.prato;
  const G = T.night ? G0.map((c, i) => i < 4 && c ? lighten(c, .2) : c) : G0;
  // molla dal bordo dello schermo
  const ex = dir > 0 ? -10 : W + 10, backX = gx - dir * s * 1.3;
  ctx.save();
  ctx.strokeStyle = G[3]; ctx.lineWidth = s * .16; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  const n = 12;
  for (let i = 0; i <= n; i++) {
    const x = ex + (backX - ex) * i / n;
    const y = gy + (i === 0 || i === n ? 0 : (i % 2 ? -1 : 1) * s * .32);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.translate(gx, gy); ctx.scale(dir, 1);
  // polsino
  ctx.fillStyle = G[2]; rr(ctx, -s * 1.45, -s * .55, s * .62, s * 1.1, s * .2); ctx.fill();
  ctx.fillStyle = G[1]; ctx.globalAlpha = .35; ctx.fillRect(-s * 1.2, -s * .55, s * .14, s * 1.1); ctx.globalAlpha = 1;
  if (G[4] === 'spikes') { // punte morbide da dinosauro
    ctx.fillStyle = '#7fcf86';
    for (let i = 0; i < 4; i++) { const a = -Math.PI * .85 + i * .32; ctx.beginPath(); ctx.moveTo(Math.cos(a) * s * .8, Math.sin(a) * s * .7); ctx.lineTo(Math.cos(a + .14) * s * 1.2, Math.sin(a + .14) * s * 1.05); ctx.lineTo(Math.cos(a + .3) * s * .85, Math.sin(a + .3) * s * .72); ctx.closePath(); ctx.fill(); }
  }
  // guantone
  const gr = ctx.createRadialGradient(s * .2, -s * .3, s * .1, 0, 0, s * 1.1);
  gr.addColorStop(0, G[0]); gr.addColorStop(1, G[1]);
  ctx.fillStyle = gr; ell(ctx, 0, 0, s, s * .85); ctx.fill();
  ctx.fillStyle = G[1]; ctx.globalAlpha = .55; ell(ctx, -s * .1, -s * .66, s * .5, s * .26, -.2); ctx.fill(); ctx.globalAlpha = 1; // pollice
  ctx.strokeStyle = 'rgba(60,40,80,.22)'; ctx.lineWidth = s * .06;
  ctx.beginPath(); ctx.arc(s * .25, s * .05, s * .5, -Math.PI * .4, Math.PI * .4); ctx.stroke();
  // decorazione del mondo
  switch (G[4]) {
    case 'wool': // muffola di lana con pompon
      ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = s * .05;
      for (const y of [-.3, 0, .3]) { ctx.beginPath(); ctx.moveTo(-s * .7, y * s); ctx.quadraticCurveTo(0, y * s + s * .12, s * .7, y * s); ctx.stroke(); }
      ctx.fillStyle = '#ffffff'; circ(ctx, -s * 1.15, -s * .62, s * .22); ctx.fill();
      break;
    case 'bubbles':
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = s * .05;
      for (const q of [[.3, -.2, .14], [-.2, .25, .1], [.45, .3, .08]]) { circ(ctx, q[0] * s, q[1] * s, q[2] * s); ctx.stroke(); }
      break;
    case 'heart':
      ctx.fillStyle = '#ffadc2'; ctx.beginPath();
      ctx.moveTo(s * .2, s * .25); ctx.bezierCurveTo(-s * .2, -s * .05, s * .05, -s * .4, s * .2, -s * .12);
      ctx.bezierCurveTo(s * .35, -s * .4, s * .6, -s * .05, s * .2, s * .25); ctx.fill();
      break;
    case 'check': // toppa a quadretti
      ctx.save(); rr(ctx, -s * .05, -s * .25, s * .5, s * .45, s * .08); ctx.clip();
      ctx.fillStyle = '#fff'; ctx.fillRect(-s * .05, -s * .25, s * .5, s * .45);
      ctx.fillStyle = '#ff8f8f';
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2) ctx.fillRect(-s * .05 + i * s * .125, -s * .25 + j * s * .1125, s * .125, s * .1125);
      ctx.restore();
      break;
    case 'starfish':
      ctx.fillStyle = '#ffa77a'; starPath(ctx, s * .25, 0, s * .3, .3); ctx.fill();
      ctx.fillStyle = '#fff3a0'; starPath(ctx, -s * .25, s * .35, s * .15, 0); ctx.fill();
      break;
    case 'star':
      ctx.fillStyle = '#ffd34d'; starPath(ctx, s * .2, 0, s * .32, 0); ctx.fill();
      ctx.strokeStyle = '#9fd3ff'; ctx.lineWidth = s * .05; ctx.beginPath(); ctx.ellipse(0, 0, s * .98, s * .83, 0, 0, Math.PI * 2); ctx.stroke();
      break;
    case 'spots': // macchie da leopardo
      ctx.fillStyle = 'rgba(150,80,30,.55)';
      for (const q of [[.3, -.3], [-.2, -.1], [.5, .2], [0, .35], [-.5, .25], [.15, .05]]) { circ(ctx, q[0] * s, q[1] * s, s * .09); ctx.fill(); }
      break;
  }
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ell(ctx, s * .25, -s * .38, s * .34, s * .14); ctx.fill();
  ctx.restore();
}

function drawParts() {
  for (const q of parts) {
    ctx.save(); ctx.globalAlpha = clamp(q.life / q.max, 0, 1); ctx.fillStyle = q.c;
    if (q.star) { starPath(ctx, q.x, q.y, q.s, q.rot); ctx.fill(); }
    else { circ(ctx, q.x, q.y, q.s * .6); ctx.fill(); }
    ctx.restore();
  }
}

function drawTexts() {
  for (const t of texts) {
    const k = t.t < .15 ? easeOutBack(t.t / .15) : 1;
    const a = t.t > t.life - .3 ? (t.life - t.t) / .3 : 1;
    ctx.save();
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.translate(t.x, t.y - t.t * 30); ctx.rotate(t.rot); ctx.scale(k, k);
    ctx.font = `bold ${Math.round(t.size)}px "Comic Sans MS","Chalkboard SE",system-ui,sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = t.size * .22; ctx.strokeText(t.s, 0, 0);
    ctx.fillStyle = t.c; ctx.fillText(t.s, 0, 0);
    ctx.restore();
  }
}

function draw() {
  drawSky();
  drawSkyStars();
  for (const c of clouds) drawCloud(c);
  drawRainbow(); // dietro sole e colline, così "nasce" dal prato
  drawSun();
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  drawAnimals();
  for (const f of sprouts) drawSprout(f);
  for (const s of slots) drawSlot(s);
  for (const p of pupi) if (p.state === 'flying' || p.state === 'leave') {
    drawPupo(p);
    if (p.bubble) { // sott'acqua: vola via dentro una bolla
      ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(2, p.r * .08);
      ctx.fillStyle = 'rgba(200,240,255,.18)'; circ(ctx, p.x, p.y, p.r * 1.75); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ell(ctx, p.x - p.r * .8, p.y - p.r * .9, p.r * .3, p.r * .15, -.7); ctx.fill();
      ctx.restore();
    }
  }
  drawFireflies();
  drawFlakes();
  drawBubbles();
  drawMagic();
  for (const g of gloves) drawGlove(g);
  drawParts();
  drawTexts();
  if (started) drawProgress();
  drawFade();
}

// =========================================================
//  AVVIO / UI
// =========================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000));
  last = now;
  // rete di sicurezza: qualunque errore in un fotogramma non deve congelare il gioco
  try { update(dt); } catch (e) { console.error(e); }
  try { draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

function goFullscreen() {
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!fn) return;
  try { const r = fn.call(el); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}

document.getElementById('play').addEventListener('click', () => {
  initAudio();
  started = true;
  document.getElementById('start').classList.add('hide');
  goFullscreen();
  sfx.fanfare();
});
const btnMute = document.getElementById('btnMute');
btnMute.addEventListener('click', () => {
  muted = !muted;
  btnMute.textContent = muted ? '🔇' : '🔊';
  btnMute.setAttribute('aria-label', muted ? "Accendi l'audio" : "Spegni l'audio");
  if (muted && 'speechSynthesis' in window) speechSynthesis.cancel();
});
// schermo intero: lo stesso bottone entra ed esce
const btnFull = document.getElementById('btnFull');
const ICON_FULL = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_EXIT = '<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5a6aa8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function exitFullscreen() {
  const fn = document.exitFullscreen || document.webkitExitFullscreen;
  if (!fn) return;
  try { const r = fn.call(document); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
function showFull() {
  const on = isFull();
  btnFull.innerHTML = on ? ICON_EXIT : ICON_FULL;
  btnFull.setAttribute('aria-label', on ? 'Esci dallo schermo intero' : 'Schermo intero');
  btnFull.title = on ? 'Esci dallo schermo intero' : 'Schermo intero';
}
btnFull.addEventListener('click', () => { if (isFull()) exitFullscreen(); else goFullscreen(); });
document.addEventListener('fullscreenchange', showFull);       // anche quando si esce con Esc o col gesto
document.addEventListener('webkitfullscreenchange', showFull);
// se il dispositivo non supporta lo schermo intero (es. iPhone), il bottone non serve
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) btnFull.style.display = 'none';
showFull();

const btnSpeed = document.getElementById('btnSpeed');
function showSpeed() {
  btnSpeed.textContent = SPD().icon;
  btnSpeed.setAttribute('aria-label', SPD().label + ' (tocca per cambiare)');
  btnSpeed.title = SPD().label;
}
btnSpeed.addEventListener('click', () => {
  speedKey = SPEED_ORDER[(SPEED_ORDER.indexOf(speedKey) + 1) % SPEED_ORDER.length];
  try { localStorage.setItem('lolo-speed', speedKey); } catch (e) {}
  showSpeed();
});
showSpeed();

let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(layout, 150); });

layout();
requestAnimationFrame(frame);
</script>
